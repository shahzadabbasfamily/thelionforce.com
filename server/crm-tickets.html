<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lion Force CRM - Support Tickets</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#050508;color:#F0F2F5;min-height:100vh}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;background:#050508}
.login-box{width:100%;max-width:400px;background:#0A0D14;border:1px solid rgba(59,107,245,0.15);border-radius:20px;padding:2.5rem}
.login-logo{text-align:center;margin-bottom:2rem}
.logo-icon{width:120px;height:120px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-bottom:1rem;overflow:hidden;border:2px solid rgba(212,175,55,0.3);box-shadow:0 0 30px rgba(212,175,55,0.15)}
.logo-icon img{width:100%;height:100%;object-fit:cover}
.login-logo h1{font-size:1.5rem;font-weight:800;color:#F0F2F5}
.login-logo p{color:#6B7280;font-size:.875rem;margin-top:.25rem}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-size:12px;font-weight:600;color:#9CA3AF;margin-bottom:.35rem;text-transform:uppercase;letter-spacing:0.05em}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:.75rem 1rem;background:rgba(255,255,255,.05);border:1px solid rgba(59,107,245,0.15);border-radius:10px;color:#F0F2F5;font-size:14px;outline:none;font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#3B6BF5}
.form-group input::placeholder,.form-group textarea::placeholder{color:#6B7280}
.form-group textarea{min-height:100px;resize:vertical}
.form-group select option{background:#0A0D14;color:#fff}
.btn{width:100%;padding:1rem;background:#3B6BF5;color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;cursor:pointer;transition:all .2s}
.btn:hover{background:#5C8DFF}
.btn-sm{padding:.5rem 1rem;font-size:12px;width:auto}
.btn-green{background:#22c55e}
.btn-green:hover{background:#16a34a}
.btn-amber{background:#f59e0b}
.btn-amber:hover{background:#d97706}
.btn-red{background:#ef4444}
.btn-red:hover{background:#dc2626}
.btn-secondary{background:rgba(59,107,245,0.1);border:1px solid rgba(59,107,245,0.2);color:#9CA3AF}
.btn-secondary:hover{background:rgba(255,255,255,.08)}
.btn-outline{background:transparent;border:1px solid rgba(59,107,245,0.2);color:#9CA3AF}
.btn-outline:hover{background:rgba(255,255,255,.05)}
.error-msg{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5;padding:.75rem 1rem;border-radius:8px;margin-bottom:1rem;font-size:13px}
.success-msg{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:#86efac;padding:.75rem 1rem;border-radius:8px;margin-bottom:1rem;font-size:13px}
.nav{height:60px;background:rgba(5,5,8,0.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(59,107,245,0.1);display:flex;align-items:center;padding:0 1.5rem;position:sticky;top:0;z-index:100}
.nav-brand{display:flex;align-items:center;gap:.5rem}
.logo-icon-small{width:32px;height:32px;border-radius:6px;overflow:hidden;border:1px solid rgba(212,175,55,0.3);display:flex;align-items:center;justify-content:center}
.logo-icon-small img{width:100%;height:100%;object-fit:cover}
.nav-brand span{font-weight:700;font-size:15px;color:#F0F2F5}
.badge-admin{font-size:10px;font-weight:600;color:#3B6BF5;background:rgba(59,107,245,0.1);padding:3px 10px;border-radius:20px;margin-left:6px;border:1px solid rgba(59,107,245,0.2)}
.badge-manager{font-size:10px;font-weight:600;color:#0891b2;background:rgba(6,182,212,0.1);padding:3px 10px;border-radius:20px;margin-left:6px;border:1px solid rgba(6,182,212,0.2)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:.75rem;position:relative}
.nav-user{color:#6B7280;font-size:13px}
#navLinks{display:flex;align-items:center;gap:.25rem;margin-left:1.5rem}
#navLinks a{color:#6B7280;text-decoration:none;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;padding:.5rem 1rem;border-radius:8px;border:1px solid transparent;transition:all .2s;display:inline-block}
#navLinks a:hover{color:#F0F2F5;background:rgba(255,255,255,.05);border-color:rgba(59,107,245,0.15)}
#navLinks a.active{color:#fff;background:rgba(59,107,245,.15);border-color:rgba(59,107,245,.3);box-shadow:0 0 12px rgba(59,107,245,.15)}
.notif-bell{position:relative;width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#6B7280;cursor:pointer;transition:all .2s;font-size:15px;background:none;border:none}
.notif-bell:hover{background:rgba(255,255,255,.05);color:#3B6BF5}
.notif-badge{position:absolute;top:2px;right:2px;min-width:16px;height:16px;border-radius:50%;background:#ef4444;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.notif-panel{display:none;position:absolute;top:44px;right:0;width:340px;max-height:420px;background:#0A0D14;border:1px solid rgba(59,107,245,0.15);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.4);z-index:150;overflow:hidden;flex-direction:column}
.notif-panel.active{display:flex}
.notif-header{padding:.75rem 1rem;border-bottom:1px solid rgba(59,107,245,0.15);display:flex;align-items:center;justify-content:space-between}
.notif-header h4{margin:0;font-size:13px;font-weight:600}
.notif-header .mark-all{font-size:11px;color:#5C8DFF;cursor:pointer;font-weight:600}
.notif-header .mark-all:hover{text-decoration:underline}
.notif-list{overflow-y:auto;flex:1;padding:.5rem 0}
.notif-item{padding:.65rem 1rem;display:flex;gap:.6rem;align-items:flex-start;cursor:pointer;transition:background .15s;border-bottom:1px solid rgba(59,107,245,0.08)}
.notif-item:hover{background:rgba(255,255,255,.05)}
.notif-item.unread{background:rgba(59,107,245,0.1)}
.notif-item.unread:hover{background:rgba(59,107,245,0.15)}
.notif-dot{width:8px;height:8px;border-radius:50%;background:rgba(59,107,245,0.2);flex-shrink:0;margin-top:.35rem}
.notif-item.unread .notif-dot{background:#3B6BF5}
.notif-body{flex:1;min-width:0}
.notif-body p{margin:0;font-size:12px;color:#F0F2F5;line-height:1.4}
.notif-body p strong{font-weight:600}
.notif-body .notif-time{font-size:11px;color:#6B7280;margin-top:.15rem}
.notif-empty{text-align:center;padding:1.5rem;color:#6B7280;font-size:13px}
@media(max-width:768px){
  .notif-panel{width:calc(100vw - 2rem);right:-.5rem}
}
.container{max-width:1200px;margin:0 auto;padding:1.5rem}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;margin-bottom:1.5rem}
.stat-card{background:#0A0D14;border:1px solid rgba(59,107,245,0.15);border-radius:16px;padding:1.25rem}
.stat-card:hover{border-color:#3B6BF5;box-shadow:0 4px 12px rgba(59,107,245,.1)}
.stat-card:active{transform:scale(.98)}
.stat-card i{font-size:1.1rem;margin-bottom:.5rem;display:block}
.stat-card .num{font-size:1.75rem;font-weight:800}
.stat-card .label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:#6B7280;margin-top:.25rem}
.card{background:#0A0D14;border:1px solid rgba(59,107,245,0.15);border-radius:16px;padding:1.5rem;margin-bottom:1rem}
.card h2{font-size:1.1rem;font-weight:700;margin-bottom:1rem}
.icon-btn{padding:.5rem;border-radius:6px;background:none;border:none;color:#6B7280;cursor:pointer;transition:all .2s;font-size:13px}
.icon-btn:hover{background:rgba(255,255,255,.05);color:#3B6BF5}
.icon-btn.danger:hover{background:rgba(239,68,68,0.1);color:#ef4444}
.tickets-table{width:100%;border-collapse:collapse}
.tickets-table th{text-align:left;padding:.75rem;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:#6B7280;border-bottom:1px solid rgba(59,107,245,0.15)}
.tickets-table td{padding:.75rem;font-size:.85rem;border-bottom:1px solid rgba(59,107,245,0.1);color:#F0F2F5}
.status-badge{display:inline-flex;align-items:center;gap:.35rem;padding:.3rem .6rem;border-radius:50px;font-size:11px;font-weight:600;border:1px solid}
.status-open{border-color:rgba(59,107,245,0.3);color:#5C8DFF;background:rgba(59,107,245,0.1)}
.status-assigned{border-color:rgba(245,158,11,0.3);color:#fbbf24;background:rgba(245,158,11,.1)}
.status-in-progress{border-color:rgba(6,182,212,0.3);color:#22d3ee;background:rgba(6,182,212,0.1)}
.status-submitted-to-tiktok{border-color:rgba(168,85,247,0.3);color:#a78bfa;background:rgba(168,85,247,0.1)}
.status-resolved{border-color:rgba(34,197,94,0.3);color:#4ade80;background:rgba(34,197,94,0.1)}
.status-active{border-color:rgba(34,197,94,0.3);color:#4ade80;background:rgba(34,197,94,0.1)}
.status-disabled{border-color:rgba(239,68,68,0.3);color:#f87171;background:rgba(239,68,68,0.1)}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#3B6BF5,#00D4FF);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff}
.empty-state{text-align:center;padding:3rem;color:#6B7280}
.milestone-tracker{display:flex;justify-content:space-between;align-items:center;margin:1.5rem 0;padding:0 .5rem}
.milestone{flex:1;text-align:center;position:relative}
.milestone-dot{width:28px;height:28px;border-radius:50%;background:rgba(59,107,245,0.1);border:2px solid rgba(59,107,245,0.2);color:#6B7280;display:flex;align-items:center;justify-content:center;margin:0 auto .5rem;font-size:11px;font-weight:700}
.milestone-dot.done{background:rgba(34,197,94,0.2);border-color:#4ade80;color:#4ade80}
.milestone-dot.active{background:rgba(59,107,245,0.1);border-color:#3B6BF5;color:#3B6BF5}
.milestone-label{font-size:10px;font-weight:600;color:#6B7280;text-transform:uppercase;letter-spacing:0.05em}
.milestone-label.done{color:#4ade80}
.milestone-label.active{color:#3B6BF5}
.milestone-line{position:absolute;top:14px;left:-50%;width:100%;height:2px;background:rgba(255,255,255,.08);z-index:-1}
.milestone-line.done{background:#86efac}
.milestone:first-child .milestone-line{display:none}
.timeline-log{display:flex;gap:1rem;margin-bottom:1.25rem}
.timeline-icon{width:36px;height:36px;border-radius:50%;background:rgba(59,107,245,0.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;color:#3B6BF5}
.timeline-content{flex:1}
.timeline-content p{font-size:14px;color:#F0F2F5;margin-bottom:.15rem}
.timeline-content .time{font-size:12px;color:#6B7280}
.timeline-content .note{font-size:13px;color:#9CA3AF;margin-top:.35rem;background:rgba(255,255,255,.05);padding:.5rem .75rem;border-radius:8px;border-left:3px solid #3B6BF5}
.screenshot-full{max-width:100%;border-radius:12px;border:1px solid rgba(59,107,245,0.15);margin-top:.5rem}
.filter-bar{display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap}
.filter-bar button{padding:.4rem .75rem;border-radius:20px;border:1px solid rgba(59,107,245,0.15);background:#0A0D14;color:#6B7280;font-size:12px;font-weight:600;cursor:pointer}
.filter-bar button.active{background:#3B6BF5;color:#fff;border-color:#3B6BF5}
.page{display:none}
.page.active{display:block}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.active{display:flex}
.modal{background:#0A0D14;border-radius:16px;border:1px solid rgba(59,107,245,0.15);width:100%;max-width:500px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
.modal-header{padding:1.25rem 1.5rem;border-bottom:1px solid rgba(59,107,245,0.15);display:flex;align-items:center;justify-content:space-between}
.modal-header h3{margin:0;font-size:1.1rem}
.modal-close{background:none;border:none;color:#6B7280;font-size:1.5rem;cursor:pointer}
.modal-body{padding:1.5rem;overflow-y:auto}
.modal-footer{padding:1rem 1.5rem;border-top:1px solid rgba(59,107,245,0.15);display:flex;gap:.5rem;justify-content:flex-end}
.manager-card{background:rgba(255,255,255,.05);border:1px solid rgba(59,107,245,0.15);border-radius:12px;padding:1rem;margin-bottom:.75rem;display:flex;align-items:center;justify-content:space-between}
.host-filter-wrap{display:flex;gap:.5rem;margin-bottom:1rem;align-items:center;flex-wrap:wrap}
.host-search{flex:1;min-width:200px;max-width:300px;padding:.5rem .75rem;border:1px solid rgba(59,107,245,0.15);border-radius:8px;font-size:13px;background:#0A0D14;color:#fff;outline:none}
.host-search:focus{border-color:#3B6BF5}
.host-select{padding:.5rem .75rem;border:1px solid rgba(59,107,245,0.15);border-radius:8px;font-size:13px;background:#0A0D14;color:#fff;outline:none;min-width:180px;cursor:pointer}
.host-select:focus{border-color:#3B6BF5}
.host-filter-label{font-size:12px;font-weight:600;color:#6B7280;text-transform:uppercase;letter-spacing:0.05em}
.perf-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.5rem}
.perf-card{background:#0A0D14;border:1px solid rgba(59,107,245,0.15);border-radius:16px;padding:1.25rem}
.perf-card .perf-name{font-size:1rem;font-weight:700;margin-bottom:.25rem}
.perf-card .perf-role{font-size:12px;color:#6B7280;margin-bottom:1rem}
.perf-stat-row{display:flex;justify-content:space-between;margin-bottom:.5rem;font-size:13px}
.perf-stat-row .perf-label{color:#6B7280}
.perf-stat-row .perf-val{font-weight:700}
.perf-bar{height:6px;border-radius:3px;background:rgba(59,107,245,0.1);margin-top:.25rem;overflow:hidden}
.perf-bar-fill{height:100%;border-radius:3px;background:#3B6BF5}
.perf-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-top:1rem}
.perf-stat{background:rgba(255,255,255,.03);border:1px solid rgba(59,107,245,0.1);border-radius:10px;padding:.75rem;text-align:center}
.perf-stat-label{font-size:10px;color:#6B7280;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:.35rem}
.perf-stat-val{font-size:1.4rem;font-weight:800;color:#F0F2F5}
.month-selector{padding:.5rem .75rem;border:1px solid rgba(59,107,245,0.15);border-radius:8px;font-size:13px;background:#0A0D14;color:#fff;outline:none;cursor:pointer;margin-bottom:1rem}

/* Growth Activities */
.growth-dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.5rem}
.growth-dash-card{background:#0A0D14;border:1px solid rgba(59,107,245,0.15);border-radius:12px;padding:1.25rem;text-align:center}
.growth-dash-card .g-icon{font-size:1.5rem;margin-bottom:.5rem}
.growth-dash-card .g-val{font-size:1.75rem;font-weight:800;color:#F0F2F5}
.growth-dash-card .g-label{font-size:11px;color:#6B7280;text-transform:uppercase;letter-spacing:0.05em;margin-top:.25rem}
.growth-dash-card.gold{border-color:rgba(212,175,55,0.3)}
.growth-dash-card.gold .g-val{color:#D4AF37}
.growth-filter-bar{display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.growth-filter-bar select,.growth-filter-bar input{padding:.5rem .75rem;background:rgba(255,255,255,.03);border:1px solid rgba(59,107,245,0.2);border-radius:8px;color:#fff;font-size:13px;outline:none;min-width:140px}
.growth-filter-bar select option{background:#0A0D14;color:#fff}
.growth-filter-bar input{min-width:180px}
.growth-filter-label{font-size:11px;font-weight:600;color:#6B7280;text-transform:uppercase;letter-spacing:0.05em;align-self:center}
.growth-card{background:#0A0D14;border:1px solid rgba(59,107,245,0.15);border-radius:12px;padding:1.25rem;margin-bottom:1rem;cursor:pointer;transition:all .2s}
.growth-card:hover{border-color:rgba(59,107,245,0.3);transform:translateY(-2px)}
.growth-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.75rem}
.growth-card-type{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.03em}
.growth-type-recruitment{background:rgba(59,107,245,0.1);color:#5C8DFF;border:1px solid rgba(59,107,245,0.2)}
.growth-type-pk{background:rgba(245,158,11,0.1);color:#fbbf24;border:1px solid rgba(245,158,11,0.2)}
.growth-card-body{font-size:13px;color:#9CA3AF;line-height:1.6}
.growth-card-body strong{color:#F0F2F5}
.growth-card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:1rem;padding-top:.75rem;border-top:1px solid rgba(59,107,245,0.1)}
.growth-card-status{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.growth-status-new{background:rgba(107,114,128,0.1);color:#9CA3AF;border:1px solid rgba(107,114,128,0.2)}
.growth-status-contacted{background:rgba(59,107,245,0.1);color:#5C8DFF;border:1px solid rgba(59,107,245,0.2)}
.growth-status-joined,.growth-status-planned{background:rgba(245,158,11,0.1);color:#fbbf24;border:1px solid rgba(245,158,11,0.2)}
.growth-status-first-live,.growth-status-completed,.growth-status-active{background:rgba(34,197,94,0.1);color:#4ade80;border:1px solid rgba(34,197,94,0.2)}
.growth-status-rejected,.growth-status-cancelled{background:rgba(239,68,68,0.1);color:#f87171;border:1px solid rgba(239,68,68,0.2)}
.growth-status-rescheduled{background:rgba(6,182,212,0.1);color:#22d3ee;border:1px solid rgba(6,182,212,0.2)}
.growth-form-section{display:none}
.growth-form-section.active{display:block}
.growth-detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}
.growth-detail-item{padding:.75rem;background:rgba(255,255,255,.03);border-radius:8px}
.growth-detail-label{font-size:11px;color:#6B7280;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:.25rem}
.growth-detail-value{font-size:14px;color:#F0F2F5;font-weight:600}
@media(max-width:768px){.growth-dash-grid{grid-template-columns:repeat(2,1fr)}.growth-detail-grid{grid-template-columns:1fr}}
@media(min-width:769px){.stats-grid{grid-template-columns:repeat(6,1fr)}}
@media(max-width:768px){
  .stats-grid{grid-template-columns:repeat(2,1fr);gap:.75rem}
  .container{padding:1rem}
  .milestone-tracker{overflow-x:auto;padding-bottom:.5rem}
  .milestone-label{font-size:9px}
  .nav{height:auto;flex-wrap:wrap;padding:.5rem .75rem;gap:.25rem}
  .nav-brand span{font-size:14px}
  .badge-admin,.badge-manager{font-size:9px;padding:2px 6px;margin-left:3px}
  .nav-user{display:none}
  .nav-right{gap:.4rem}
  #navLinks{width:100%;order:3;margin-top:.25rem;display:flex;gap:.25rem;margin-left:0}
  #navLinks a{font-size:11px !important;padding:.4rem .6rem !important}
  .tickets-table{font-size:12px}
  .tickets-table th,.tickets-table td{padding:.5rem .35rem;white-space:nowrap}
  .filter-bar button{padding:.3rem .5rem;font-size:11px}
  .modal{margin:0 .5rem;max-height:92vh}
  .manager-card{flex-direction:column;align-items:flex-start !important;gap:.5rem}
}
</style>
</head>
<body>

<!-- LOGIN PAGE -->
<div class="page active" id="loginPage">
  <div class="login-page">
    <div class="login-box">
      <div class="login-logo">
        <div class="logo-icon"><img src="logo.png" alt="The Lion Force"></div>
        <h1>CRM Login</h1>
        <p>Lion Force - Support Ticket Management</p>
      </div>
      <div id="loginError"></div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="loginUser" placeholder="Enter username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPass" placeholder="Enter password">
      </div>
      <button class="btn" id="loginBtn">Sign In</button>
      <p style="text-align:center;color:#6B7280;font-size:12px;margin-top:1rem">Secure Manager & Admin Portal</p>
    </div>
  </div>
</div>

<!-- APP PAGE -->

<script>

var db = null;
var currentUser = null;
var allTickets = [];
var allHosts = [];
var allManagers = [];
var currentPage = 'tickets';
var currentTicketId = null;
var currentFilter = 'all';
var currentHostFilter = '';
var mgrResetId = null;

function showError(msg) {
  var el = document.getElementById('loginError');
  if (el) el.innerHTML = '<div class="error-msg">' + msg + '</div>';
}

function hashPW(pw) {
  var h = 0;
  for (var i = 0; i < pw.length; i++) {
    h = ((h << 5) - h + pw.charCodeAt(i)) | 0;
  }
  return 'h' + Math.abs(h).toString(16);
}

function initFirebase() {
  try {
    firebase.initializeApp({
      apiKey: "AIzaSyA7WO6r3cbiZiJZVv82wF2SnCI5rRJRLkI",
      authDomain: "lionforce-crm.firebaseapp.com",
      databaseURL: "https://lionforce-crm-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "lionforce-crm",
      storageBucket: "lionforce-crm.firebasestorage.app",
      messagingSenderId: "951731260622",
      appId: "1:951731260622:web:9dedc08f62461add52949f"
    });
    db = firebase.database();
    return true;
  } catch(e) {
    showError('Firebase failed: ' + e.message);
    return false;
  }
}

function fbGet(path) { return db.ref(path).once('value').then(function(s){ return s.val(); }); }
function fbSet(path, val) { return db.ref(path).set(val); }
function fbUp(path, val) { return db.ref(path).update(val); }
function fbRm(path) { return db.ref(path).remove(); }
function fbPush(path, val) { return db.ref(path).push(val); }

function showPage(id) {
  var pages = document.getElementsByClassName('page');
  for (var i = 0; i < pages.length; i++) pages[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
}

function ensureAdmin() {
  var adminId = 'admin_1';
  var adminData = {
    id: adminId, name: 'Admin', username: 'admin',
    email: 'admin@thelionforce.com',
    password: hashPW('lionforce2026'),
    provider: 'The Lion Force', region: 'UAE',
    role: 'admin', status: 'active',
    configFileId: null, createdAt: Date.now()
  };
  fbSet('server/hosts/' + adminId, adminData).catch(function(e) { console.log('Admin setup failed', e); });
}

function doLogin() {
  var userInput = document.getElementById('loginUser').value.trim();
  var pass = document.getElementById('loginPass').value;
  var btn = document.getElementById('loginBtn');
  if (!userInput || !pass) { showError('Please enter username and password'); return; }
  btn.disabled = true;
  document.getElementById('loginError').innerHTML = '';

  Promise.all([fbGet('server/hosts'), fbGet('server/managers')]).then(function(results) {
    var hosts = results[0] || {};
    var managers = results[1] || {};
    var allUsers = [];
    for (var k in hosts) { if (hosts[k]) allUsers.push(hosts[k]); }
    for (var k2 in managers) { if (managers[k2]) allUsers.push(managers[k2]); }

    if (allUsers.length === 0) { throw new Error('No accounts found.'); }

    var pw = hashPW(pass);
    var user = null;
    for (var i = 0; i < allUsers.length; i++) {
      var rec = allUsers[i];
      var matchUser = rec.username && rec.username.toLowerCase() === userInput.toLowerCase();
      var matchEmail = rec.email && rec.email.toLowerCase() === userInput.toLowerCase();
      if ((matchUser || matchEmail) && rec.password === pw) {
        user = rec;
        break;
      }
    }

    if (!user) {
      var foundUser = false;
      for (var j = 0; j < allUsers.length; j++) {
        var ru = allUsers[j].username && allUsers[j].username.toLowerCase() === userInput.toLowerCase();
        var re = allUsers[j].email && allUsers[j].email.toLowerCase() === userInput.toLowerCase();
        if (ru || re) { foundUser = true; break; }
      }
      if (foundUser) { throw new Error('Wrong password.'); }
      else { throw new Error('Username not found.'); }
    }
    if (user.status === 'disabled') { throw new Error('Account is disabled. Contact admin.'); }

    currentUser = user;
    localStorage.setItem('lf_crm_user', JSON.stringify(currentUser));
    showApp();
  }).catch(function(err) {
    showError(err.message);
    btn.disabled = false;
  });
}

function doLogout() {
  currentUser = null;
  localStorage.removeItem('lf_crm_user');
  showPage('loginPage');
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
  document.getElementById('loginBtn').disabled = false;
}

function showApp() {
  showPage('appPage');
  renderNav();
  goPage('tickets');
  loadNotifications();
}

function renderNav() {
  var isAdmin = currentUser && currentUser.role === 'admin';
  document.getElementById('adminBadge').style.display = isAdmin ? 'inline-block' : 'none';
  document.getElementById('managerBadge').style.display = !isAdmin ? 'inline-block' : 'none';
  document.getElementById('navUser').textContent = currentUser ? currentUser.name : '';
  var links = '';
  links += '<a href="#" onclick="goPage(\'tickets\');return false" class="' + (currentPage === 'tickets' ? 'active' : '') + '">Tickets</a>';
  if (isAdmin) {
    links += '<a href="#" onclick="goPage(\'managers\');return false" class="' + (currentPage === 'managers' ? 'active' : '') + '">Managers</a>';
    links += '<a href="#" onclick="goPage(\'performance\');return false" class="' + (currentPage === 'performance' ? 'active' : '') + '">Performance</a>';
  }
  links += '<a href="#" onclick="goPage(\'growth\');return false" class="' + (currentPage === 'growth' ? 'active' : '') + '">Growth Activities</a>';
  links += '<a href="https://thelionforce.com/" target="_blank" style="color:#D4AF37;border-color:rgba(212,175,55,0.3)"><i class="fas fa-external-link-alt" style="margin-right:4px;font-size:10px"></i>Official Website</a>';
  document.getElementById('navLinks').innerHTML = links;
}

function goPage(p) {
  currentPage = p;
  renderNav();
  if (p === 'tickets') loadTickets();
  else if (p === 'managers') renderManagers();
  else if (p === 'performance') renderPerformance();
  else if (p === 'growth') renderGrowth();
  else if (p === 'ticketDetail') renderTicketDetail(currentTicketId);
}

function loadTickets() {
  var el = document.getElementById('mainContent');
  el.innerHTML = '<div class="stats-grid">' +
    '<div class="stat-card" onclick="filterTickets(\'all\')" style="cursor:pointer;transition:all .2s"><i class="fas fa-ticket-alt" style="color:#3B6BF5"></i><div class="num" id="statTotal">-</div><div class="label">Total</div></div>' +
    '<div class="stat-card" onclick="filterTickets(\'open\')" style="cursor:pointer;transition:all .2s"><i class="fas fa-exclamation-circle" style="color:#f59e0b"></i><div class="num" id="statOpen">-</div><div class="label">Open</div></div>' +
    '<div class="stat-card" onclick="filterTickets(\'assigned\')" style="cursor:pointer;transition:all .2s"><i class="fas fa-user-check" style="color:#a855f7"></i><div class="num" id="statAssigned">-</div><div class="label">Assigned</div></div>' +
    '<div class="stat-card" onclick="filterTickets(\'in-progress\')" style="cursor:pointer;transition:all .2s"><i class="fas fa-spinner" style="color:#06b6d4"></i><div class="num" id="statProgress">-</div><div class="label">In Progress</div></div>' +
    '<div class="stat-card" onclick="filterTickets(\'submitted-to-tiktok\')" style="cursor:pointer;transition:all .2s"><i class="fas fa-paper-plane" style="color:#7c3aed"></i><div class="num" id="statTikTok">-</div><div class="label">TikTok</div></div>' +
    '<div class="stat-card" onclick="filterTickets(\'resolved\')" style="cursor:pointer;transition:all .2s"><i class="fas fa-check-circle" style="color:#22c55e"></i><div class="num" id="statResolved">-</div><div class="label">Resolved</div></div>' +
    '</div>' +
    '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem"><h2>All Tickets</h2><button class="btn btn-sm btn-secondary" onclick="loadTickets()"><i class="fas fa-sync-alt"></i> Refresh</button></div>' +
    '<div class="host-filter-wrap">' +
    '<span class="host-filter-label">Filter by Host:</span>' +
    '<input type="text" class="host-search" id="hostSearch" placeholder="Search host name..." oninput="onHostSearch()">' +
    '<select class="host-select" id="hostSelect" onchange="filterByHost()"><option value="">All Hosts</option></select>' +
    '</div>' +
    '<div class="filter-bar">' +
    '<button onclick="filterTickets(\'all\')" class="active" id="f-all">All</button>' +
    '<button onclick="filterTickets(\'open\')" id="f-open">Open</button>' +
    '<button onclick="filterTickets(\'assigned\')" id="f-assigned">Assigned</button>' +
    '<button onclick="filterTickets(\'in-progress\')" id="f-in-progress">In Progress</button>' +
    '<button onclick="filterTickets(\'submitted-to-tiktok\')" id="f-submitted-to-tiktok">TikTok</button>' +
    '<button onclick="filterTickets(\'resolved\')" id="f-resolved">Resolved</button>' +
    '</div><div id="ticketList"><div class="empty-state"><i class="fas fa-spinner fa-spin" style="font-size:2rem"></i><p>Loading tickets...</p></div></div></div>';

  Promise.all([fbGet('server/tickets'), fbGet('server/hosts')]).then(function(results) {
    var ts = results[0] || {};
    var hs = results[1] || {};
    allTickets = []; for (var k in ts) { if (ts[k]) { ts[k]._key = k; allTickets.push(ts[k]); } }
    allHosts = []; for (var k2 in hs) { if (hs[k2]) allHosts.push(hs[k2]); }
    allTickets.sort(function(a,b){ return b.createdAt - a.createdAt; });
    // Populate host dropdown alphabetically
    allHosts.sort(function(a,b){ return a.name.localeCompare(b.name); });
    var sel = document.getElementById('hostSelect');
    if (sel) {
      sel.innerHTML = '<option value="">All Hosts</option>';
      for (var hi = 0; hi < allHosts.length; hi++) {
        if (allHosts[hi].role !== 'admin') {
          var opt = document.createElement('option');
          opt.value = allHosts[hi].id;
          opt.textContent = allHosts[hi].name;
          if (allHosts[hi].id === currentHostFilter) opt.selected = true;
          sel.appendChild(opt);
        }
      }
    }
    updateStats();
    renderTicketList();
  });
}

function updateStats() {
  var isAdmin = currentUser && currentUser.role === 'admin';
  var visible = allTickets;
  if (!isAdmin) {
    visible = allTickets.filter(function(t){
      return t.assignedToName === currentUser.name || t.status === 'open';
    });
  }
  if (currentHostFilter) {
    visible = visible.filter(function(t){ return t.hostId === currentHostFilter; });
  }
  var counts = {total:visible.length, open:0, assigned:0, 'in-progress':0, 'submitted-to-tiktok':0, resolved:0};
  for (var i=0;i<visible.length;i++) counts[visible[i].status] = (counts[visible[i].status]||0)+1;
  document.getElementById('statTotal').textContent = counts.total;
  document.getElementById('statOpen').textContent = counts.open;
  document.getElementById('statAssigned').textContent = counts.assigned;
  document.getElementById('statProgress').textContent = counts['in-progress'];
  document.getElementById('statTikTok').textContent = counts['submitted-to-tiktok'];
  document.getElementById('statResolved').textContent = counts.resolved;
}

function filterTickets(status) {
  currentFilter = status;
  var btns = document.querySelectorAll('.filter-bar button');
  for (var i=0;i<btns.length;i++) btns[i].classList.remove('active');
  document.getElementById('f-' + status).classList.add('active');
  renderTicketList();
}

function filterByHost() {
  var sel = document.getElementById('hostSelect');
  currentHostFilter = sel ? sel.value : '';
  updateStats();
  renderTicketList();
}

function onHostSearch() {
  var search = document.getElementById('hostSearch').value.trim().toLowerCase();
  var sel = document.getElementById('hostSelect');
  if (!sel) return;
  var opts = sel.querySelectorAll('option');
  for (var i = 0; i < opts.length; i++) {
    var txt = opts[i].textContent.toLowerCase();
    if (i === 0) { opts[i].style.display = ''; continue; }
    opts[i].style.display = txt.indexOf(search) === 0 ? '' : 'none';
  }
  // Auto-select first visible match if user typed something
  if (search.length > 0) {
    for (var j = 1; j < opts.length; j++) {
      if (opts[j].style.display !== 'none') {
        sel.value = opts[j].value;
        currentHostFilter = opts[j].value;
        updateStats();
        renderTicketList();
        break;
      }
    }
  }
}

function renderTicketList() {
  var isAdmin = currentUser && currentUser.role === 'admin';
  var filtered = allTickets;
  if (!isAdmin) {
    // Manager sees: tickets assigned to them + all open tickets
    filtered = allTickets.filter(function(t){
      return t.assignedToName === currentUser.name || t.status === 'open';
    });
  }
  if (currentFilter !== 'all') {
    filtered = filtered.filter(function(t){ return t.status === currentFilter; });
  }
  if (currentHostFilter) {
    filtered = filtered.filter(function(t){ return t.hostId === currentHostFilter; });
  }
  var el = document.getElementById('ticketList');
  if (filtered.length === 0) {
    el.innerHTML = '<div class="empty-state"><i class="fas fa-ticket-alt" style="font-size:3rem"></i><p>No tickets found.</p></div>';
    return;
  }
  var html = '<div style="overflow-x:auto;-webkit-overflow-scrolling:touch"><table class="tickets-table"><thead><tr><th>Ticket</th><th>Host</th><th>Status</th><th>Manager</th><th>Date</th><th></th></tr></thead><tbody>';
  for (var i=0;i<filtered.length;i++) {
    var t = filtered[i];
    var h = null;
    for (var j=0;j<allHosts.length;j++) if (allHosts[j].id === t.hostId) { h = allHosts[j]; break; }
    html += '<tr><td><p style="font-weight:600">' + t.title + '</p><p style="color:#6B7280;font-size:12px">' + t.details.substring(0,50) + (t.details.length>50?'...':'') + '</p></td>';
    html += '<td><div style="display:flex;align-items:center;gap:.5rem"><div class="avatar" style="width:28px;height:28px;font-size:10px">' + (h?h.name.charAt(0):'?') + '</div><span style="font-size:13px">' + (h?h.name:'Unknown') + '</span></div></td>';
    html += '<td><span class="status-badge status-' + t.status + '">' + t.status.replace(/-/g,' ') + '</span></td>';
    html += '<td style="font-size:13px;color:#6B7280">' + (t.assignedToName||'-') + '</td>';
    html += '<td style="font-size:12px;color:#6B7280">' + new Date(t.createdAt).toLocaleDateString() + '</td>';
    html += '<td><button class="icon-btn" onclick="viewTicketDetail(\'' + t.id + '\')"><i class="fas fa-eye"></i></button></td></tr>';
  }
  html += '</tbody></table></div>';
  el.innerHTML = html;
}

function viewTicketDetail(tid) {
  currentTicketId = tid;
  goPage('ticketDetail');
}

function renderTicketDetail(tid) {
  var isAdmin = currentUser && currentUser.role === 'admin';
  var el = document.getElementById('mainContent');
  var t = null;
  for (var i=0;i<allTickets.length;i++) if (allTickets[i].id === tid) { t = allTickets[i]; break; }
  if (!t) { goPage('tickets'); return; }
  // Manager can only view their assigned tickets or open tickets
  if (!isAdmin && t.assignedToName !== currentUser.name && t.status !== 'open') {
    goPage('tickets'); return;
  }
  var h = null;
  for (var j=0;j<allHosts.length;j++) if (allHosts[j].id === t.hostId) { h = allHosts[j]; break; }

  fbGet('server/ticketLogs/' + tid).then(function(logs) {
    var logArr = [];
    for (var k in logs) if (logs[k]) { logs[k]._key = k; logArr.push(logs[k]); }
    logArr.sort(function(a,b){ return b.date - a.date; });

    var stages = ['open','assigned','in-progress','submitted-to-tiktok','resolved'];
    var stageLabels = ['Submitted','Assigned','In Progress','TikTok','Resolved'];
    var currentStageIdx = stages.indexOf(t.status);
    if (currentStageIdx < 0) currentStageIdx = 0;

    var html = '<div style="max-width:800px;margin:0 auto">';
    html += '<div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem"><button class="icon-btn" onclick="goPage(\'tickets\')"><i class="fas fa-arrow-left"></i></button><h2 style="font-size:1.25rem;font-weight:700">Ticket #' + tid.replace('ticket_','') + '</h2><button class="btn btn-sm btn-green" style="margin-left:auto" onclick="openUpdateModal()"><i class="fas fa-edit"></i> Update</button></div>';

    html += '<div class="card" style="margin-bottom:1.5rem"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem"><div><h3 style="font-size:1.1rem;font-weight:700">' + t.title + '</h3><p style="color:#6B7280;font-size:13px"><i class="fas fa-user"></i> ' + (h?h.name:'Unknown') + (h&&h.username?' (@'+h.username+')':'') + ' <span style="margin-left:1rem"><i class="fas fa-calendar"></i> ' + new Date(t.createdAt).toLocaleString() + '</span></p></div><span class="status-badge status-' + t.status + '">' + t.status.replace(/-/g,' ') + '</span></div>';
    html += '<p style="font-size:15px;line-height:1.6;margin:1rem 0">' + t.details + '</p>';
    if (t.phone) {
      html += '<p style="color:#6B7280;font-size:13px;margin-bottom:.5rem"><i class="fas fa-phone"></i> <strong>Contact / WhatsApp:</strong> <a href="https://wa.me/' + t.phone.replace(/[^0-9]/g,'') + '" target="_blank" style="color:#3B6BF5;text-decoration:none">' + t.phone + '</a></p>';
    }
    if (t.screenshot) {
      html += '<p style="color:#6B7280;font-size:13px;margin-bottom:.5rem"><i class="fas fa-image"></i> Screenshot</p><img src="' + t.screenshot + '" class="screenshot-full" style="cursor:pointer" onclick="window.open(this.src)">';
    }
    html += '</div>';

    html += '<div class="card" style="margin-bottom:1.5rem"><h3 style="font-size:14px;font-weight:600;margin-bottom:1rem;color:#6B7280;text-transform:uppercase;letter-spacing:0.05em">Progress Tracker</h3><div class="milestone-tracker">';
    for (var s=0;s<stages.length;s++) {
      var done = s <= currentStageIdx;
      var active = s === currentStageIdx;
      html += '<div class="milestone"><div class="milestone-line' + (done?' done':'') + '"></div><div class="milestone-dot' + (done?' done':'') + (active?' active':'') + '">' + (done&&!active?'<i class="fas fa-check" style="font-size:10px"></i>':(s+1)) + '</div><div class="milestone-label' + (done?' done':'') + (active?' active':'') + '">' + stageLabels[s] + '</div></div>';
    }
    html += '</div></div>';

    var stageGroups = {
      'Submitted': [], 'Assigned': [], 'In Progress': [],
      'Submitted to TikTok': [], 'Resolved': [], 'Other': []
    };
    for (var l=0;l<logArr.length;l++) {
      var lg = logArr[l];
      var a = lg.action;
      if (a.indexOf('Resolved')>=0) stageGroups['Resolved'].push(lg);
      else if (a.indexOf('TikTok')>=0) stageGroups['Submitted to TikTok'].push(lg);
      else if (a.indexOf('Progress')>=0) stageGroups['In Progress'].push(lg);
      else if (a.indexOf('Assigned')>=0) stageGroups['Assigned'].push(lg);
      else if (a.indexOf('Submitted')>=0 || a.indexOf('open')>=0) stageGroups['Submitted'].push(lg);
      else stageGroups['Other'].push(lg);
    }
    var groupOrder = ['Submitted','Assigned','In Progress','Submitted to TikTok','Resolved'];
    var groupIcons = {

function openEditMgrModal(id) {

}
function closeMgrModal() {
  document.getElementById('mgrModal').classList.remove('active');
  mgrEditId = null;
}

function submitManager() {
  var n = document.getElementById('mName').value.trim();
  var u = document.getElementById('mUser').value.trim();
  var p = document.getElementById('mPass').value;
  var ph1 = document.getElementById('mPhone1').value.trim();
  var ph2 = document.getElementById('mPhone2').value.trim();
  if (!n || !u) {
    document.getElementById('mgrMsg').innerHTML = '<div class="error-msg">Name and username are required</div>';
    return;
  }
  if (!mgrEditId && !p) {
    document.getElementById('mgrMsg').innerHTML = '<div class="error-msg">Password is required for new managers</div>';
    return;
  }
  if (!mgrEditId && p.length < 4) {
    document.getElementById('mgrMsg').innerHTML = '<div class="error-msg">Password must be at least 4 characters</div>';
    return;
  }
  if (mgrEditId) {
    fbGet('server/managers').then(function(d) {
      if (d) {
        for (var k in d) {
          if (d[k] && d[k].id !== mgrEditId && d[k].username && d[k].username.toLowerCase() === u.toLowerCase()) {
            document.getElementById('mgrMsg').innerHTML = '<div class="error-msg">Username already exists</div>';
            return;
          }
        }
      }
      return fbUp('server/managers/' + mgrEditId, { name: n, username: u, phone1: ph1, phone2: ph2 });
    }).then(function() {
      closeMgrModal();
      renderManagers();
    }).catch(function(err) {
      document.getElementById('mgrMsg').innerHTML = '<div class="error-msg">' + err.message + '</div>';
    });
    return;
  }
  fbGet('server/managers').then(function(d) {
    if (d) {
      for (var k in d) {
        if (d[k] && d[k].username && d[k].username.toLowerCase() === u.toLowerCase()) {
          document.getElementById('mgrMsg').innerHTML = '<div class="error-msg">Username already exists</div>';
          return;
        }
      }
    }
    var id = 'mgr_' + Date.now();
    return fbSet('server/managers/' + id, {
      id: id, name: n, username: u,
      password: hashPW(p),
      phone1: ph1, phone2: ph2,
      role: 'manager', status: 'active',
      createdAt: Date.now()
    });
  }).then(function() {
    closeMgrModal();
    renderManagers();
  }).catch(function(err) {
    document.getElementById('mgrMsg').innerHTML = '<div class="error-msg">' + err.message + '</div>';
  });
}

function openUpdateModal() {
  var t = null;
  for (var i = 0; i < allTickets.length; i++) if (allTickets[i].id === currentTicketId) { t = allTickets[i]; break; }
  if (!t) {
    fbGet('server/tickets/' + currentTicketId).then(function(data) {
      if (data) { allTickets = [data]; t = data; doOpenUpdateModal(t); }
    });
    return;
  }
  doOpenUpdateModal(t);
}

function doOpenUpdateModal(t) {
  if (!t) return;
  document.getElementById('upMsg').innerHTML = '';
  document.getElementById('upNote').value = '';
  var statusSel = document.getElementById('upStatus');
  if (statusSel) statusSel.value = t.status || 'open';

  var populateMgrs = function() {
    var mgrSel = document.getElementById('upManager');
    if (mgrSel) {
      mgrSel.innerHTML = '<option value="">-- Select Manager --</option>';
      for (var m = 0; m < allManagers.length; m++) {
        if (allManagers[m].status === 'active') {
          var opt = document.createElement('option');
          opt.value = allManagers[m].name;
          opt.textContent = allManagers[m].name;
          if (allManagers[m].name === t.assignedToName) opt.selected = true;
          mgrSel.appendChild(opt);
        }
      }
    }
    document.getElementById('updateModal').classList.add('active');
  };

  if (allManagers.length === 0) {
    fbGet('server/managers').then(function(data) {
      allManagers = [];
      for (var k in data) { if (data[k]) allManagers.push(data[k]); }
      populateMgrs();
    }).catch(function() { populateMgrs(); });
  } else {
    populateMgrs();
  }
}

function closeUpdateModal() {
  document.getElementById('updateModal').classList.remove('active');
}

function saveUpdate() {
  var status = document.getElementById('upStatus').value;
  var managerName = document.getElementById('upManager').value;
  var note = document.getElementById('upNote').value.trim();
  var msg = document.getElementById('upMsg');

  if (!status) { msg.innerHTML = '<div class="error-msg">Please select a status.</div>'; return; }

  var updates = { status: status, updatedAt: Date.now() };
  if (managerName) {
    updates.assignedToName = managerName;
    var mgrId = '';
    for (var i = 0; i < allManagers.length; i++) {
      if (allManagers[i].name === managerName) { mgrId = allManagers[i].id; break; }
    }
    if (mgrId) updates.assignedTo = mgrId;
  } else {
    updates.assignedToName = '';
    updates.assignedTo = '';
  }

  fbUp('server/tickets/' + currentTicketId, updates).then(function() {
    var logEntry = { action: 'Status updated to ' + status.replace(/-/g,' '), by: currentUser ? currentUser.name : 'Admin', date: Date.now(), note: note || '' };
    if (managerName) logEntry.action += ' | Assigned to ' + managerName;

  });
}

function renderGrowthDashboard(allActs) {
  var now = new Date();
  var monthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  var monthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 1).getTime();
  var monthActs = allActs.filter(function(a) {
    var d = a.createdAt || 0;
    return d >= monthStart && d < monthEnd;
  });
  var recruits = monthActs.filter(function(a) { return a.taskType === 'recruitment'; });
  var pkBattles = monthActs.filter(function(a) { return a.taskType === 'pk'; });
  var joined = recruits.filter(function(a) { return a.joinedAgency === 'Yes'; }).length;
  var firstLive = recruits.filter(function(a) { return a.firstLiveDone === 'Yes'; }).length;
  var pkPlanned = pkBattles.filter(function(a) { return a.status === 'Planned'; }).length;
  var pkCompleted = pkBattles.filter(function(a) { return a.status === 'Completed'; }).length;
  var expDiamonds = 0, actDiamonds = 0;
  for (var i = 0; i < allActs.length; i++) {
    var a = allActs[i];
    if (a.expectedDiamonds) expDiamonds += parseInt(a.expectedDiamonds) || 0;
    if (a.actualDiamonds) actDiamonds += parseInt(a.actualDiamonds) || 0;
  }
  var bestMgr = '';
  var mgrScores = {};
  for (var j = 0; j < allActs.length; j++) {
    var m = allActs[j].managerName;
    if (!m) continue;
    if (!mgrScores[m]) mgrScores[m] = 0;
    if (allActs[j].status === 'Completed' || allActs[j].status === 'Active' || allActs[j].status === 'First Live Done') mgrScores[m] += 1;
  }
  var bestScore = 0;
  for (var mn in mgrScores) { if (mgrScores[mn] > bestScore) { bestScore = mgrScores[mn]; bestMgr = mn; } }

  var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem"><h2 style="font-size:1.25rem;font-weight:700">Growth Activities</h2><button class="btn btn-sm" onclick="renderGrowthForm()"><i class="fas fa-plus"></i> Add Activity</button></div>';
  html += '<div class="growth-dash-grid">';
  html += '<div class="growth-dash-card"><div class="g-icon" style="color:#5C8DFF"><i class="fas fa-user-plus"></i></div><div class="g-val">' + recruits.length + '</div><div class="g-label">New Hosts This Month</div></div>';
  html += '<div class="growth-dash-card"><div class="g-icon" style="color:#fbbf24"><i class="fas fa-check-circle"></i></div><div class="g-val">' + joined + '</div><div class="g-label">Joined Hosts</div></div>';
  html += '<div class="growth-dash-card"><div class="g-icon" style="color:#4ade80"><i class="fas fa-video"></i></div><div class="g-val">' + firstLive + '</div><div class="g-label">First Live Done</div></div>';
  html += '<div class="growth-dash-card"><div class="g-icon" style="color:#a78bfa"><i class="fas fa-fire"></i></div><div class="g-val">' + pkPlanned + '</div><div class="g-label">PK Battles Planned</div></div>';
  html += '<div class="growth-dash-card"><div class="g-icon" style="color:#22d3ee"><i class="fas fa-trophy"></i></div><div class="g-val">' + pkCompleted + '</div><div class="g-label">PK Battles Completed</div></div>';
  html += '<div class="growth-dash-card gold"><div class="g-icon" style="color:#D4AF37"><i class="fas fa-gem"></i></div><div class="g-val">' + expDiamonds + '</div><div class="g-label">Expected Diamonds</div></div>';
  html += '<div class="growth-dash-card gold"><div class="g-icon" style="color:#D4AF37"><i class="fas fa-gem"></i></div><div class="g-val">' + actDiamonds + '</div><div class="g-label">Actual Diamonds</div></div>';
  html += '<div class="growth-dash-card gold"><div class="g-icon" style="color:#D4AF37"><i class="fas fa-crown"></i></div><div class="g-val" style="font-size:1rem">' + (bestMgr || '-') + '</div><div class="g-label">Best Manager</div></div>';
  html += '</div>';
  document.getElementById('mainContent').innerHTML = html;
}

  html += '<select id="gFilterStatus" onchange="filterGrowthActivities()"><option value="">All Status</option><option>New</option><option>Contacted</option><option>Joined</option><option>Active</option><option>Rejected</option><option>Planned</option><option>Completed</option><option>Cancelled</option><option>Rescheduled</option></select>';

function filterGrowthActivities() {
  var month = document.getElementById('gFilterMonth').value;
  var manager = document.getElementById('gFilterManager') ? document.getElementById('gFilterManager').value : '';
  var region = document.getElementById('gFilterRegion').value;
  var type = document.getElementById('gFilterType').value;
  var status = document.getElementById('gFilterStatus').value;
  currentGrowthFilter = { month: month, manager: manager, region: region, taskType: type, status: status };
  fbGet('server/growthActivities').then(function(data) {
    var allActs = [];
    for (var k in data) { if (data[k]) allActs.push(data[k]); }
    var isAdmin = currentUser && currentUser.role === 'admin';
    if (!isAdmin) {
      allActs = allActs.filter(function(a) { return a.managerName === currentUser.name; });
    }
    if (month !== '') {
      var y = new Date().getFullYear();
      var ms = new Date(y, parseInt(month), 1).getTime();
      var me = new Date(y, parseInt(month) + 1, 1).getTime();
      allActs = allActs.filter(function(a) { var d = a.createdAt || 0; return d >= ms && d < me; });
    }
    if (manager) allActs = allActs.filter(function(a) { return a.managerName === manager; });
    if (region) allActs = allActs.filter(function(a) { return a.region === region; });
    if (type) allActs = allActs.filter(function(a) { return a.taskType === type; });
    if (status) allActs = allActs.filter(function(a) { return a.status === status; });
    renderGrowthList(allActs);
  });
}

function renderGrowthList(allActs) {
  var el = document.getElementById('growthList');
  if (!el) return;
  allActs.sort(function(a,b){ return (b.createdAt || 0) - (a.createdAt || 0); });
  if (allActs.length === 0) {
    el.innerHTML = '<div class="card"><div class="empty-state"><i class="fas fa-chart-line" style="font-size:3rem"></i><p>No growth activities found.</p></div></div>';
    return;
  }
  var html = '';
  for (var i = 0; i < allActs.length; i++) {
    var a = allActs[i];
    var typeClass = a.taskType === 'recruitment' ? 'growth-type-recruitment' : 'growth-type-pk';
    var typeLabel = a.taskType === 'recruitment' ? 'New Host Recruitment' : 'PK Battle';

function submitGrowthActivity() {
  var msg = document.getElementById('growthMsg');
  var type = document.getElementById('gTaskType').value;
  var managerName = document.getElementById('gManagerName').value.trim();
  if (!type) { msg.innerHTML = '<div class="error-msg">Please select a task type.</div>'; return; }
  if (!managerName) { msg.innerHTML = '<div class="error-msg">Manager name is required.</div>'; return; }

  var data = { id: 'ga_' + Date.now(), taskType: type, managerName: managerName, createdAt: Date.now(), createdBy: currentUser ? currentUser.username : '' };

  if (type === 'recruitment') {
    var hostName = document.getElementById('gHostName').value.trim();
    if (!hostName) { msg.innerHTML = '<div class="error-msg">Host name is required.</div>'; return; }
    data.hostName = hostName;
    data.tiktokUsername = document.getElementById('gTiktokUsername').value.trim();
    data.region = document.getElementById('gRecRegion').value;
    data.recruitmentDate = document.getElementById('gRecruitmentDate').value;
    data.firstLiveDone = document.getElementById('gFirstLiveDone').value;
    data.firstLiveDate = document.getElementById('gFirstLiveDate').value;
    data.totalLiveFirstMonth = document.getElementById('gTotalLiveFirstMonth').value;
    data.expectedDiamonds = document.getElementById('gExpDiamonds').value;
    data.actualDiamonds = document.getElementById('gActDiamonds').value;
    data.notes = document.getElementById('gRecNotes').value.trim();
    data.status = document.getElementById('gRecStatus').value;
  } else {
    var host1 = document.getElementById('gHost1').value.trim();
    var host2 = document.getElementById('gHost2').value.trim();
    if (!host1 || !host2) { msg.innerHTML = '<div class="error-msg">Both host names are required.</div>'; return; }
    data.host1 = host1;
    data.host2 = host2;
    data.region = document.getElementById('gPkRegion').value;
    data.matchDate = document.getElementById('gMatchDate').value;
    data.matchTime = document.getElementById('gMatchTime').value;
    data.expectedDiamonds = document.getElementById('gPkExpDiamonds').value;
    data.actualDiamonds = document.getElementById('gPkActDiamonds').value;
    data.battlePlayed = document.getElementById('gBattlePlayed').value;
    data.winnerHost = document.getElementById('gWinnerHost').value.trim();
    data.notes = document.getElementById('gPkNotes').value.trim();
    data.status = document.getElementById('gPkStatus').value;
  }

  fbSet('server/growthActivities/' + data.id, data).then(function() {
    msg.innerHTML = '<div class="success-msg">Activity saved successfully!</div>';
    setTimeout(function() { goPage('growth'); }, 1000);
  }).catch(function(err) {
    msg.innerHTML = '<div class="error-msg">Error: ' + err.message + '</div>';
  });
}

function renderPerformanceWithGrowth() {
  var el = document.getElementById('mainContent');
  el.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin" style="font-size:2rem"></i><p>Loading performance data...</p></div>';
  var now = new Date();
  var monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var currentMonth = now.getMonth();
  var currentYear = now.getFullYear();
  Promise.all([fbGet('server/managers'), fbGet('server/tickets'), fbGet('server/growthActivities')]).then(function(results) {
    var managers = results[0] || {};
    var tickets = results[1] || {};
    var growth = results[2] || {};
    var mgrList = [];
    for (var k in managers) {
      if (managers[k] && managers[k].status === 'active' && managers[k].role !== 'admin') {
        mgrList.push(managers[k]);
      }
    }
    var ticketList = [];
    for (var tk in tickets) { if (tickets[tk]) ticketList.push(tickets[tk]); }
    var growthList = [];
    for (var gk in growth) { if (growth[gk]) growthList.push(growth[gk]); }

    var monthStart = new Date(currentYear, currentMonth, 1).getTime();
    var monthEnd = new Date(currentYear, currentMonth + 1, 1).getTime();

    var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem"><h2 style="font-size:1.25rem;font-weight:700">Manager Performance</h2>';
    html += '<select class="month-selector" id="perfMonth" onchange="renderPerformanceWithGrowth()">';
    for (var m = 0; m < 12; m++) {
      html += '<option value="' + m + '"' + (m === currentMonth ? ' selected' : '') + '>' + monthNames[m] + ' ' + currentYear + '</option>';
    }
    html += '</select></div>';

    html += '<div class="perf-grid">';
    for (var i = 0; i < mgrList.length; i++) {
      var mgr = mgrList[i];
      var mgrTickets = ticketList.filter(function(t) { return t.assignedToName === mgr.name; });
      var assigned = mgrTickets.length;
      var resolved = mgrTickets.filter(function(t) { return t.status && t.status.toLowerCase() === 'resolved'; }).length;
      var mgrGrowth = growthList.filter(function(g) { return g.managerName === mgr.name; });
      var monthGrowth = mgrGrowth.filter(function(g) { var d = g.createdAt || 0; return d >= monthStart && d < monthEnd; });
      var recruits = monthGrowth.filter(function(g) { return g.taskType === 'recruitment'; }).length;
      var joined = monthGrowth.filter(function(g) { return g.taskType === 'recruitment' && g.joinedAgency === 'Yes'; }).length;
      var firstLive = monthGrowth.filter(function(g) { return g.taskType === 'recruitment' && g.firstLiveDone === 'Yes'; }).length;
      var pkDone = monthGrowth.filter(function(g) { return g.taskType === 'pk' && g.status === 'Completed'; }).length;
      var expDia = 0, actDia = 0;
      for (var j = 0; j < monthGrowth.length; j++) {
        if (monthGrowth[j].expectedDiamonds) expDia += parseInt(monthGrowth[j].expectedDiamonds) || 0;
        if (monthGrowth[j].actualDiamonds) actDia += parseInt(monthGrowth[j].actualDiamonds) || 0;
      }
      var resolutionRate = assigned > 0 ? Math.round((resolved / assigned) * 100) : 0;
      var overallScore = Math.min(100, Math.round((resolved * 10 + recruits * 5 + joined * 10 + firstLive * 15 + pkDone * 10 + actDia / 100) / 5));

      html += '<div class="perf-card">';
      html += '<div class="perf-card-header">';
      html += '<div class="perf-avatar">' + mgr.name.charAt(0) + '</div>';
      html += '<div class="perf-info"><div class="perf-name">' + mgr.name + '</div><div class="perf-role">Manager</div></div>';
      html += '</div>';
      var totalLive = monthGrowth.filter(function(g) { return g.taskType === 'recruitment' && g.firstLiveDone === 'Yes'; }).reduce(function(sum, g) { return sum + (parseInt(g.totalLiveFirstMonth) || 0); }, 0);
      html += '<div class="perf-stats">';
      html += '<div class="perf-stat"><div class="perf-stat-label">Tickets Assigned</div><div class="perf-stat-val">' + assigned + '</div></div>';
      html += '<div class="perf-stat"><div class="perf-stat-label">Tickets Resolved</div><div class="perf-stat-val">' + resolved + '</div></div>';
      html += '<div class="perf-stat"><div class="perf-stat-label">New Hosts</div><div class="perf-stat-val">' + recruits + '</div></div>';
      html += '<div class="perf-stat"><div class="perf-stat-label">Hosts Joined</div><div class="perf-stat-val">' + joined + '</div></div>';
      html += '<div class="perf-stat"><div class="perf-stat-label">First Live Done</div><div class="perf-stat-val">' + firstLive + '</div></div>';
      html += '<div class="perf-stat"><div class="perf-stat-label">Total Live</div><div class="perf-stat-val">' + totalLive + '</div></div>';
      html += '<div class="perf-stat"><div class="perf-stat-label">PK Battles</div><div class="perf-stat-val">' + pkDone + '</div></div>';
      html += '<div class="perf-stat"><div class="perf-stat-label">Exp Diamonds</div><div class="perf-stat-val">' + expDia + '</div></div>';
      html += '<div class="perf-stat"><div class="perf-stat-label">Total Diamonds</div><div class="perf-stat-val">' + actDia + '</div></div>';
      html += '</div>';
      html += '<div style="margin-top:1rem"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:.25rem"><span>Resolution Rate</span><span>' + resolutionRate + '%</span></div><div class="perf-bar"><div class="perf-bar-fill" style="width:' + resolutionRate + '%"></div></div></div>';
      html += '<div style="margin-top:.75rem"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:.25rem"><span>Overall Score</span><span>' + overallScore + '/100</span></div><div class="perf-bar"><div class="perf-bar-fill" style="width:' + overallScore + '%;background:linear-gradient(90deg,#D4AF37,#fbbf24)"></div></div></div>';
      html += '</div>';
    }
    html += '</div>';
    el.innerHTML = html;
  }).catch(function(err) {
    el.innerHTML = '<div class="error-msg">Failed to load performance data: ' + err.message + '</div>';
  });
}

setInterval(function() {
  if (currentUser) loadNotifications();
}, 30000);
</script>
