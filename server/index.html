<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lion Force Server Portal</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#050508;color:#F0F2F5;min-height:100vh}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;position:relative}
.glow-1{position:fixed;top:25%;left:25%;width:400px;height:400px;background:rgba(59,107,245,0.08);border-radius:50%;filter:blur(100px);pointer-events:none}
.glow-2{position:fixed;bottom:25%;right:25%;width:300px;height:300px;background:rgba(0,212,255,0.05);border-radius:50%;filter:blur(80px);pointer-events:none}
.login-box{width:100%;max-width:420px;position:relative;z-index:1}
.login-logo{text-align:center;margin-bottom:2rem}
.logo-icon{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#3B6BF5,#00D4FF);display:inline-flex;align-items:center;justify-content:center;margin-bottom:1rem}
.logo-icon span{color:#fff;font-weight:800;font-size:20px}
.login-logo h1{font-size:1.75rem;font-weight:800;background:linear-gradient(135deg,#3B6BF5,#00D4FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-logo p{color:#6B7280;font-size:.875rem;margin-top:.25rem}
.card{background:#0A0D14;border:1px solid rgba(59,107,245,0.15);border-radius:20px;padding:2rem}
.card h2{font-size:1.25rem;font-weight:700;margin-bottom:1.5rem;text-align:center}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:#6B7280;margin-bottom:.5rem}
.form-group input,.form-group select{width:100%;padding:.875rem 1rem;background:rgba(255,255,255,.03);border:1px solid rgba(59,107,245,0.2);border-radius:10px;color:#fff;font-size:1rem;outline:none}
.form-group input:focus,.form-group select:focus{border-color:#3B6BF5}
.form-group input[type=file]{padding:.5rem;font-size:13px}
.btn{width:100%;padding:1rem;background:#3B6BF5;color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;cursor:pointer;transition:all .3s}
.btn:hover{background:#5C8DFF}
.btn-sm{padding:.6rem 1rem;font-size:12px;width:auto}
.error-msg{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5;padding:.75rem 1rem;border-radius:8px;margin-bottom:1rem;font-size:.875rem}
.success-msg{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:#86efac;padding:.75rem 1rem;border-radius:8px;margin-bottom:1rem;font-size:.875rem}
.nav{height:64px;background:rgba(5,5,8,0.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(59,107,245,0.1);display:flex;align-items:center;padding:0 1.5rem;position:sticky;top:0;z-index:100}
.nav-brand{display:flex;align-items:center;gap:.75rem}
.nav-brand .logo-icon{width:36px;height:36px;border-radius:10px}
.nav-brand span{font-weight:700;font-size:16px}
.badge-admin{font-size:11px;font-weight:600;color:#3B6BF5;background:rgba(59,107,245,0.1);padding:4px 10px;border-radius:20px;margin-left:8px}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:1rem}
.nav-user{color:#6B7280;font-size:.875rem}
.nav a{color:#6B7280;text-decoration:none;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;transition:color .3s;margin-right:1.5rem}
.nav a:hover,.nav a.active{color:#3B6BF5}
.container{max-width:1200px;margin:0 auto;padding:2rem 1.5rem}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:2rem}
.stat-card{background:#0A0D14;border:1px solid rgba(59,107,245,0.15);border-radius:16px;padding:1.5rem}
.stat-card i{font-size:1.25rem;margin-bottom:.75rem;display:block}
.stat-card .num{font-size:2rem;font-weight:800}
.stat-card .label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:#6B7280;margin-top:.25rem}
.action-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem;margin-bottom:2rem}
.action-card{background:#0A0D14;border:1px solid rgba(59,107,245,0.15);border-radius:16px;padding:1.5rem;display:flex;align-items:center;gap:1rem;cursor:pointer;transition:all .3s;text-align:left;border:none;color:inherit;width:100%;font-family:inherit}
.action-card:hover{border-color:rgba(59,107,245,0.4)}
.action-icon{width:48px;height:48px;border-radius:12px;background:rgba(59,107,245,0.1);display:flex;align-items:center;justify-content:center;font-size:1.25rem;flex-shrink:0}
.action-card h3{font-size:1rem;font-weight:600;margin-bottom:.25rem}
.action-card p{font-size:13px;color:#6B7280}
.hosts-table{width:100%;background:#0A0D14;border:1px solid rgba(59,107,245,0.15);border-radius:16px;overflow:hidden}
.hosts-table table{width:100%;border-collapse:collapse}
.hosts-table th{text-align:left;padding:1rem;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:#6B7280;border-bottom:1px solid rgba(59,107,245,0.1)}
.hosts-table td{padding:1rem;font-size:.875rem;border-bottom:1px solid rgba(59,107,245,0.06)}
.hosts-table tr:last-child td{border-bottom:none}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#3B6BF5,#00D4FF);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;flex-shrink:0}
.status-badge{display:inline-flex;align-items:center;gap:.35rem;padding:.35rem .7rem;border-radius:50px;font-size:11px;font-weight:600;border:1px solid}
.status-active{border-color:rgba(34,197,94,.3);color:#86efac;background:rgba(34,197,94,.08)}
.status-disabled{border-color:rgba(239,68,68,.3);color:#fca5a5;background:rgba(239,68,68,.08)}
.icon-btn{padding:.5rem;border-radius:8px;background:none;border:none;color:#6B7280;cursor:pointer;transition:all .2s}
.icon-btn:hover{background:rgba(59,107,245,.1);color:#3B6BF5}
.icon-btn.danger:hover{background:rgba(239,68,68,.1);color:#ef4444}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.active{display:flex}
.modal{background:#0A0D14;border:1px solid rgba(59,107,245,.2);border-radius:20px;width:100%;max-width:500px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
.modal-header{padding:1.25rem 1.5rem;border-bottom:1px solid rgba(59,107,245,.08);display:flex;align-items:center;justify-content:space-between}
.modal-header h3{margin:0;font-size:1.1rem}
.modal-close{background:none;border:none;color:#888;font-size:1.5rem;cursor:pointer;width:32px;height:32px}
.modal-body{padding:1.5rem;overflow-y:auto}
.modal-footer{padding:1rem 1.5rem;border-top:1px solid rgba(59,107,245,.08);display:flex;gap:.5rem;justify-content:flex-end}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.config-item{background:#0A0D14;border:1px solid rgba(59,107,245,0.15);border-radius:12px;padding:1rem;margin-bottom:.75rem;display:flex;align-items:center;justify-content:space-between}
.empty-state{text-align:center;padding:3rem;color:#374151}
.empty-state i{font-size:3rem;margin-bottom:1rem;display:block;color:#1f2937}
.page{display:none}
.page.active{display:block}
.loading{text-align:center;padding:3rem}
.spinner{width:40px;height:40px;border:2px solid rgba(59,107,245,0.2);border-top-color:#3B6BF5;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 1rem}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:768px){.container{padding:1rem}.stats-grid{grid-template-columns:repeat(2,1fr)}.form-row{grid-template-columns:1fr}.hosts-table{overflow-x:auto}.hosts-table table{min-width:700px}}
</style>
</head>
<body>

<div class="page active" id="loginPage">
  <div class="login-page">
    <div class="glow-1"></div>
    <div class="glow-2"></div>
    <div class="login-box">
      <div class="login-logo">
        <div class="logo-icon"><span>LF</span></div>
        <h1>Server Portal</h1>
        <p>The Lion Force - VPN Config Access</p>
      </div>
      <div class="card">
        <h2>Sign In</h2>
        <div id="loginError"></div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="your@email.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPass" placeholder="Enter password">
        </div>
        <button class="btn" onclick="app.login()">Sign In</button>
      </div>
      <p style="text-align:center;color:#374151;font-size:13px;margin-top:1.5rem">Secure VPN Config Portal - The Lion Force</p>
    </div>
  </div>
</div>

<div class="page" id="appPage">
  <nav class="nav">
    <div class="nav-brand">
      <div class="logo-icon"><span>LF</span></div>
      <span>Server Portal</span>
      <span class="badge-admin" id="adminBadge" style="display:none">Admin</span>
    </div>
    <div id="navLinks"></div>
    <div class="nav-right">
      <span class="nav-user" id="navUser"></span>
      <button class="icon-btn" onclick="app.logout()" title="Sign Out"><i class="fas fa-sign-out-alt"></i></button>
    </div>
  </nav>
  <div class="container" id="mainContent"></div>
</div>

<div class="modal-overlay" id="hostModal" onclick="if(event.target===this) app.closeModal()">
  <div class="modal">
    <div class="modal-header">
      <h3>Add New Host</h3>
      <button class="modal-close" onclick="app.closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div id="hostMsg"></div>
      <div class="form-group"><label>Full Name *</label><input id="hName"></div>
      <div class="form-group"><label>TikTok Username</label><input id="hTiktok" placeholder="@username"></div>
      <div class="form-group"><label>Email *</label><input type="email" id="hEmail"></div>
      <div class="form-group"><label>Password *</label><input type="password" id="hPass" minlength="4"></div>
      <div class="form-row">
        <div class="form-group"><label>Provider</label><select id="hProvider"><option>EDIS</option><option>Cloudzy</option></select></div>
        <div class="form-group"><label>Region</label><select id="hRegion"><option>UAE</option><option>UK</option></select></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary btn-sm" onclick="app.closeModal()">Cancel</button>
      <button class="btn btn-sm" onclick="app.submitHost()">Create Host</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, get, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyA7WO6r3cbiZiJZVv82wF2SnCI5rRJRLkI",
  authDomain: "lionforce-crm.firebaseapp.com",
  databaseURL: "https://lionforce-crm-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "lionforce-crm",
  storageBucket: "lionforce-crm.firebasestorage.app",
  messagingSenderId: "951731260622",
  appId: "1:951731260622:web:9dedc08f62461add52949f"
};

const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);

async function fbGet(p) { const s = await get(ref(db, p)); return s.exists() ? s.val() : null; }
async function fbSet(p, v) { await set(ref(db, p), v); }
async function fbUp(p, v) { await update(ref(db, p), v); }
async function fbRm(p) { await remove(ref(db, p)); }

function hashPW(p) { let h = 0; for (let i = 0; i < p.length; i++) h = ((h << 5) - h + p.charCodeAt(i)) | 0; return 'h' + Math.abs(h).toString(16); }

window.app = {
  user: null,
  hosts: [],
  configs: [],
  page: 'dashboard',

  async init() {
    await this.seedAdmin();
    const saved = localStorage.getItem('lf_server_user');
    if (saved) {
      try { this.user = JSON.parse(saved); this.showApp(); } catch (e) { localStorage.removeItem('lf_server_user'); }
    }
  },

  async seedAdmin() {
    const d = await fbGet('server/hosts');
    if (!d) {
      await fbSet('server/hosts/admin_1', {
        id: 'admin_1', name: 'Lion Force Admin', email: 'admin@thelionforce.com',
        password: hashPW('lionforce2026'), tiktokUsername: null,
        provider: 'EDIS', region: 'UAE', role: 'admin', status: 'active',
        configFileId: null, createdAt: Date.now()
      });
    }
  },

  async login() {
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPass').value;
    document.getElementById('loginError').innerHTML = '<div class="loading"><div class="spinner" style="width:24px;height:24px"></div></div>';
    try {
      const d = await fbGet('server/hosts');
      const arr = d ? Object.values(d).filter(x => x !== null) : [];
      const u = arr.find(x => x.email === email && x.password === hashPW(pass));
      if (!u) throw new Error('Invalid email or password');
      if (u.status === 'disabled') throw new Error('Account is disabled');
      this.user = { ...u, id: u.id || u.email.replace(/[^a-zA-Z0-9]/g, '') };
      localStorage.setItem('lf_server_user', JSON.stringify(this.user));
      this.showApp();
    } catch (e) {
      document.getElementById('loginError').innerHTML = '<div class="error-msg">' + e.message + '</div>';
    }
  },

  logout() {
    this.user = null;
    localStorage.removeItem('lf_server_user');
    document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
    document.getElementById('loginPage').classList.add('active');
  },

  showApp() {
    document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
    document.getElementById('appPage').classList.add('active');
    this.renderNav();
    this.goPage('dashboard');
  },

  renderNav() {
    const isAdmin = this.user && this.user.role === 'admin';
    document.getElementById('adminBadge').style.display = isAdmin ? 'inline-block' : 'none';
    document.getElementById('navUser').textContent = this.user ? this.user.name : '';
    let links = '<a href="#" onclick="app.goPage('dashboard');return false" class="' + (this.page === 'dashboard' ? 'active' : '') + '">Dashboard</a>';
    if (isAdmin) {
      links += '<a href="#" onclick="app.goPage('hosts');return false" class="' + (this.page === 'hosts' ? 'active' : '') + '">Hosts</a>';
      links += '<a href="#" onclick="app.goPage('configs');return false" class="' + (this.page === 'configs' ? 'active' : '') + '">Configs</a>';
    }
    document.getElementById('navLinks').innerHTML = links;
  },

  async goPage(p) {
    this.page = p;
    this.renderNav();
    if (p === 'dashboard') await this.renderDashboard();
    else if (p === 'hosts') await this.renderHosts();
    else if (p === 'configs') await this.renderConfigs();
    else if (p === 'upload') this.renderUpload();
  },

  async renderDashboard() {
    const el = document.getElementById('mainContent');
    const isAdmin = this.user.role === 'admin';
    if (!isAdmin) {
      const cs = await fbGet('server/configs') || {};
      const mc = Object.values(cs).find(x => x && x.assignedTo === this.user.id);
      el.innerHTML = this.hostView(mc);
      return;
    }
    const d = await fbGet('server/hosts') || {};
    const cs = await fbGet('server/configs') || {};
    this.hosts = Object.values(d).filter(x => x !== null);
    this.configs = Object.values(cs).filter(x => x !== null);
    const active = this.hosts.filter(x => x.status === 'active').length;
    const disabled = this.hosts.filter(x => x.status === 'disabled').length;
    el.innerHTML = `
      <div class="stats-grid">
        <div class="stat-card"><i class="fas fa-users" style="color:#3B6BF5"></i><div class="num">${this.hosts.length}</div><div class="label">Total Hosts</div></div>
        <div class="stat-card"><i class="fas fa-shield-alt" style="color:#22c55e"></i><div class="num">${active}</div><div class="label">Active</div></div>
        <div class="stat-card"><i class="fas fa-user-slash" style="color:#f59e0b"></i><div class="num">${disabled}</div><div class="label">Disabled</div></div>
        <div class="stat-card"><i class="fas fa-file-shield" style="color:#00D4FF"></i><div class="num">${this.configs.length}</div><div class="label">Config Files</div></div>
      </div>
      <div class="action-grid">
        <button class="action-card" onclick="app.goPage('hosts')"><div class="action-icon" style="background:rgba(59,107,245,0.1)"><i class="fas fa-users" style="color:#3B6BF5"></i></div><div><h3>Manage Hosts</h3><p>Add, edit, disable hosts</p></div></button>
        <button class="action-card" onclick="app.goPage('configs')"><div class="action-icon" style="background:rgba(0,212,255,0.1)"><i class="fas fa-file-shield" style="color:#00D4FF"></i></div><div><h3>Config Files</h3><p>Upload and assign configs</p></div></button>
      </div>
      <div class="hosts-table">
        <div style="padding:1rem 1.5rem;border-bottom:1px solid rgba(59,107,245,0.1);display:flex;justify-content:space-between;align-items:center">
          <h3 style="font-size:1rem">All Hosts</h3>
          <button class="btn btn-sm" onclick="app.goPage('hosts')">View All</button>
        </div>
        ${this.hosts.length === 0 ? '<div class="empty-state"><i class="fas fa-users"></i><p>No hosts yet. Add your first host.</p></div>' :
          '<table><tbody>' + this.hosts.slice(0, 5).map(h =>
            `<tr><td><div style="display:flex;align-items:center;gap:.75rem"><div class="avatar">${h.name.charAt(0)}</div><div><p style="font-weight:600">${h.name}</p><p style="color:#6B7280;font-size:12px">${h.email}</p></div></div></td>
            <td><span style="color:#6B7280;font-size:12px"><i class="fas fa-server"></i> ${h.provider} <i class="fas fa-map-marker-alt" style="margin-left:.5rem"></i> ${h.region}</span></td>
            <td><span class="status-badge ${h.status === 'active' ? 'status-active' : 'status-disabled'}">${h.status}</span></td></tr>`
          ).join('') + '</tbody></table>'}
      </div>`;
  },

  hostView(mc) {
    return `<div style="max-width:600px;margin:0 auto">
      <div class="card" style="margin-bottom:1.5rem">
        <h3 style="margin-bottom:1rem"><i class="fas fa-user" style="color:#3B6BF5"></i> Your Profile</h3>
        <div style="display:grid;gap:.75rem">
          <div style="display:flex;align-items:center;gap:.75rem"><i class="fas fa-user" style="color:#3B6BF5;width:20px"></i><div><span style="color:#6B7280;font-size:12px">Name</span><p style="font-weight:600">${this.user.name}</p></div></div>
          ${this.user.tiktokUsername ? `<div style="display:flex;align-items:center;gap:.75rem"><i class="fab fa-tiktok" style="color:#3B6BF5;width:20px"></i><div><span style="color:#6B7280;font-size:12px">TikTok</span><p style="font-weight:600">@${this.user.tiktokUsername}</p></div></div>` : ''}
          <div style="display:flex;align-items:center;gap:.75rem"><i class="fas fa-server" style="color:#3B6BF5;width:20px"></i><div><span style="color:#6B7280;font-size:12px">Provider</span><p style="font-weight:600">${this.user.provider}</p></div></div>
          <div style="display:flex;align-items:center;gap:.75rem"><i class="fas fa-map-marker-alt" style="color:#3B6BF5;width:20px"></i><div><span style="color:#6B7280;font-size:12px">Region</span><p style="font-weight:600">${this.user.region}</p></div></div>
        </div>
      </div>
      <div class="card">
        <h3 style="margin-bottom:1rem"><i class="fas fa-shield-alt" style="color:#3B6BF5"></i> WireGuard Config</h3>
        ${mc ? `<div style="background:rgba(59,107,245,0.05);border-radius:12px;padding:1rem;margin-bottom:1rem">
          <p style="color:#6B7280;font-size:12px">Config File</p>
          <p style="font-weight:600">${mc.fileName}</p>
          <p style="color:#6B7280;font-size:12px">${mc.provider} - ${mc.region}</p>
        </div>
        <button class="btn" onclick="app.downloadConfig()"><i class="fas fa-download"></i> Download Config</button>` :
        `<div style="background:rgba(245,158,11,0.05);border:1px solid rgba(245,158,11,0.2);border-radius:12px;padding:1rem">
          <p style="color:#f59e0b;font-weight:600;font-size:14px">No config assigned yet.</p>
          <p style="color:#6B7280;font-size:12px;margin-top:.25rem">Your admin will assign a config file to you soon.</p>
        </div>`}
      </div>
    </div>`;
  },

  async renderHosts() {
    const el = document.getElementById('mainContent');
    const d = await fbGet('server/hosts') || {};
    const cs = await fbGet('server/configs') || {};
    this.hosts = Object.values(d).filter(x => x !== null);
    this.configs = Object.values(cs).filter(x => x !== null);
    el.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem">
      <h2 style="font-size:1.25rem;font-weight:700">All Hosts (${this.hosts.length})</h2>
      <button class="btn btn-sm" onclick="app.openModal()"><i class="fas fa-plus"></i> Add Host</button>
    </div>
    <div class="hosts-table" style="overflow-x:auto">
      <table style="min-width:700px">
        <thead><tr><th>Host</th><th>Details</th><th>Config</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>
          ${this.hosts.length === 0 ? '<tr><td colspan="5" style="text-align:center;color:#374151;padding:2rem">No hosts yet. Click Add Host to create one.</td></tr>' :
            this.hosts.map(h => {
              const mc = this.configs.find(x => x && x.assignedTo === h.id);
              const free = this.configs.filter(x => x && !x.assignedTo);
              return `<tr>
                <td><div style="display:flex;align-items:center;gap:.75rem"><div class="avatar">${h.name.charAt(0)}</div><div><p style="font-weight:600">${h.name}</p>${h.tiktokUsername ? `<p style="color:#6B7280;font-size:12px">@${h.tiktokUsername}</p>` : ''}</div></div></td>
                <td><p style="color:#6B7280;font-size:12px">${h.email}</p><p style="color:#6B7280;font-size:11px"><i class="fas fa-server"></i> ${h.provider} <i class="fas fa-map-marker-alt"></i> ${h.region}</p></td>
                <td>${mc ? `<span style="color:#3B6BF5;font-size:13px;font-weight:600">${mc.fileName}</span>` :
                  `<select onchange="app.assignConfig(this.value, '${h.id}')" style="background:rgba(255,255,255,.03);border:1px solid rgba(59,107,245,0.2);border-radius:6px;color:#6B7280;font-size:12px;padding:.35rem .5rem;outline:none">
                    <option value="">Assign config...</option>${free.map(c => `<option value="${c.id}">${c.fileName}</option>`).join('')}
                  </select>`}</td>
                <td><span class="status-badge ${h.status === 'active' ? 'status-active' : 'status-disabled'}">${h.status}</span></td>
                <td>
                  <button class="icon-btn" onclick="app.toggleHost('${h.id}')" title="${h.status === 'active' ? 'Disable' : 'Enable'}"><i class="fas fa-${h.status === 'active' ? 'user-slash' : 'user-check'}"></i></button>
                  <button class="icon-btn danger" onclick="app.deleteHost('${h.id}')" title="Delete"><i class="fas fa-trash"></i></button>
                </td>
              </tr>`;
            }).join('')}
        </tbody>
      </table>
    </div>`;
  },

  async renderConfigs() {
    const el = document.getElementById('mainContent');
    const cs = await fbGet('server/configs') || {};
    const hs = await fbGet('server/hosts') || {};
    this.configs = Object.values(cs).filter(x => x !== null);
    this.hosts = Object.values(hs).filter(x => x !== null);
    el.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem">
      <h2 style="font-size:1.25rem;font-weight:700">WireGuard Configs (${this.configs.length})</h2>
      <button class="btn btn-sm" onclick="app.goPage('upload')"><i class="fas fa-upload"></i> Upload Config</button>
    </div>
    ${this.configs.length === 0 ? '<div class="empty-state"><i class="fas fa-file-shield"></i><p>No config files yet. Upload your first config.</p></div>' :
      this.configs.map(c => {
        const ah = this.hosts.find(h => h && h.id === c.assignedTo);
        const free = this.hosts.filter(h => h && h.status === 'active' && h.role === 'host' && !this.configs.find(x => x && x.assignedTo === h.id));
        return `<div class="config-item">
          <div style="display:flex;align-items:center;gap:1rem">
            <div style="width:40px;height:40px;border-radius:10px;background:rgba(59,107,245,0.1);display:flex;align-items:center;justify-content:center"><i class="fas fa-file-shield" style="color:#3B6BF5"></i></div>
            <div>
              <p style="font-weight:600;font-size:14px">${c.fileName}</p>
              <p style="color:#6B7280;font-size:11px"><i class="fas fa-server"></i> ${c.provider} <i class="fas fa-map-marker-alt" style="margin-left:.5rem"></i> ${c.region}</p>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:.75rem">
            ${ah ? `<span style="color:#22c55e;font-size:12px"><i class="fas fa-user-check"></i> ${ah.name}</span>
              <button onclick="app.unassignConfig('${c.id}', '${ah.id}')" style="background:none;border:none;color:#6B7280;font-size:11px;cursor:pointer;text-decoration:underline">Unassign</button>` :
              `<select onchange="app.assignCfg(this.value, '${c.id}')" style="background:rgba(255,255,255,.03);border:1px solid rgba(59,107,245,0.2);border-radius:6px;color:#6B7280;font-size:12px;padding:.35rem .5rem;outline:none">
                <option value="">Assign to host...</option>${free.map(h => `<option value="${h.id}">${h.name}</option>`).join('')}
              </select>`}
            <button class="icon-btn danger" onclick="app.delConfig('${c.id}')" title="Delete"><i class="fas fa-trash"></i></button>
          </div>
        </div>`;
      }).join('')}`;
  },

  renderUpload() {
    const freeHosts = this.hosts.filter(h => h && h.status === 'active' && h.role === 'host');
    if (freeHosts.length === 0) { alert('No active hosts available. Add a host first.'); this.goPage('configs'); return; }
    document.getElementById('mainContent').innerHTML = `<div style="max-width:500px;margin:0 auto">
      <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem">
        <button class="icon-btn" onclick="app.goPage('configs')"><i class="fas fa-arrow-left"></i></button>
        <h2 style="font-size:1.25rem;font-weight:700">Upload Config</h2>
      </div>
      <div class="card">
        <div id="upMsg"></div>
        <div class="form-group">
          <label>Select Host *</label>
          <select id="uHost">${freeHosts.map(h => `<option value="${h.id}">${h.name} - ${h.email}</option>`).join('')}</select>
        </div>
        <div class="form-group">
          <label>Upload .conf File *</label>
          <input type="file" id="uFile" accept=".conf">
        </div>
        <div class="form-row">
          <div class="form-group"><label>Provider</label><select id="uProvider"><option>EDIS</option><option>Cloudzy</option></select></div>
          <div class="form-group"><label>Region</label><select id="uRegion"><option>UAE</option><option>UK</option></select></div>
        </div>
        <button class="btn" onclick="app.submitUpload()"><i class="fas fa-upload"></i> Upload Config</button>
      </div>
    </div>`;
  },

  async submitHost() {
    const n = document.getElementById('hName').value.trim(), tk = document.getElementById('hTiktok').value.trim();
    const e = document.getElementById('hEmail').value.trim(), p = document.getElementById('hPass').value;
    const pr = document.getElementById('hProvider').value, re = document.getElementById('hRegion').value;
    if (!n || !e || !p) { document.getElementById('hostMsg').innerHTML = '<div class="error-msg">All required fields must be filled</div>'; return; }
    try {
      const d = await fbGet('server/hosts');
      if (d) { const dup = Object.values(d).find(x => x && x.email === e); if (dup) { document.getElementById('hostMsg').innerHTML = '<div class="error-msg">Email already exists</div>'; return; } }
      const id = 'host_' + Date.now();
      await fbSet('server/hosts/' + id, { id, name: n, tiktokUsername: tk || null, email: e, password: hashPW(p), provider: pr, region: re, role: 'host', status: 'active', configFileId: null, createdAt: Date.now() });
      this.closeModal();
      document.getElementById('hName').value = ''; document.getElementById('hTiktok').value = '';
      document.getElementById('hEmail').value = ''; document.getElementById('hPass').value = '';
      document.getElementById('hostMsg').innerHTML = '';
      await this.renderHosts();
    } catch (e) { document.getElementById('hostMsg').innerHTML = '<div class="error-msg">' + e.message + '</div>'; }
  },

  async toggleHost(id) {
    const h = this.hosts.find(x => x && x.id === id); if (!h) return;
    const ns = h.status === 'active' ? 'disabled' : 'active';
    await fbUp('server/hosts/' + id, { status: ns });
    await this.renderHosts();
  },

  async deleteHost(id) { if (!confirm('Delete this host permanently?')) return; await fbRm('server/hosts/' + id); await this.renderHosts(); },

  async assignConfig(cid, hid) {
    if (!cid) return;
    const ex = this.configs.find(x => x && x.assignedTo === hid);
    if (ex) await fbUp('server/configs/' + ex.id, { assignedTo: null });
    await fbUp('server/configs/' + cid, { assignedTo: hid });
    await fbUp('server/hosts/' + hid, { configFileId: cid });
    await this.renderHosts();
  },

  async submitUpload() {
    const hid = document.getElementById('uHost').value, f = document.getElementById('uFile');
    const pr = document.getElementById('uProvider').value, re = document.getElementById('uRegion').value;
    if (!hid || !f.files[0]) { document.getElementById('upMsg').innerHTML = '<div class="error-msg">Select a host and choose a .conf file</div>'; return; }
    const file = f.files[0];
    if (!file.name.endsWith('.conf')) { document.getElementById('upMsg').innerHTML = '<div class="error-msg">Only .conf files are allowed</div>'; return; }
    try {
      const content = await file.text();
      const id = 'cfg_' + Date.now();
      await fbSet('server/configs/' + id, { id, fileName: file.name, content, provider: pr, region: re, assignedTo: hid, uploadedAt: Date.now() });
      await fbUp('server/hosts/' + hid, { configFileId: id });
      document.getElementById('upMsg').innerHTML = '<div class="success-msg">Config uploaded and assigned!</div>';
      setTimeout(() => this.goPage('configs'), 1200);
    } catch (e) { document.getElementById('upMsg').innerHTML = '<div class="error-msg">' + e.message + '</div>'; }
  },

  async assignCfg(hid, cid) {
    if (!hid) return;
    const ex = this.configs.find(x => x && x.assignedTo === hid);
    if (ex) await fbUp('server/configs/' + ex.id, { assignedTo: null });
    await fbUp('server/configs/' + cid, { assignedTo: hid });
    await fbUp('server/hosts/' + hid, { configFileId: cid });
    await this.renderConfigs();
  },

  async unassignConfig(cid, hid) {
    await fbUp('server/configs/' + cid, { assignedTo: null });
    await fbUp('server/hosts/' + hid, { configFileId: null });
    await this.renderConfigs();
  },

  async delConfig(id) { if (!confirm('Delete this config file?')) return; await fbRm('server/configs/' + id); await this.renderConfigs(); },

  async downloadConfig() {
    const mc = this.configs.find(x => x && x.assignedTo === this.user.id);
    if (!mc || !mc.content) { alert('Config not found'); return; }
    const b = new Blob([mc.content], { type: 'text/plain' }), u = URL.createObjectURL(b), a = document.createElement('a');
    a.href = u; a.download = mc.fileName || 'config.conf'; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(u);
  },

  openModal() { document.getElementById('hostModal').classList.add('active'); },
  closeModal() { document.getElementById('hostModal').classList.remove('active'); document.getElementById('hostMsg').innerHTML = ''; }
};

app.init();
</script>
</body>
</html>
