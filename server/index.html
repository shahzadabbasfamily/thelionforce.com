<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lion Force Server Portal</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#050508;color:#F0F2F5;min-height:100vh}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;position:relative}
.glow-1{position:fixed;top:25%;left:25%;width:400px;height:400px;background:rgba(59,107,245,0.08);border-radius:50%;filter:blur(100px);pointer-events:none}
.glow-2{position:fixed;bottom:25%;right:25%;width:300px;height:300px;background:rgba(0,212,255,0.05);border-radius:50%;filter:blur(80px);pointer-events:none}
.login-box{width:100%;max-width:420px;position:relative;z-index:1}
.login-logo{text-align:center;margin-bottom:2rem}
.logo-icon{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#3B6BF5,#00D4FF);display:inline-flex;align-items:center;justify-content:center;margin-bottom:1rem}
.logo-icon span{color:#fff;font-weight:800;font-size:20px}
.login-logo h1{font-size:1.75rem;font-weight:800;background:linear-gradient(135deg,#3B6BF5,#00D4FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-logo p{color:#6B7280;font-size:.875rem;margin-top:.25rem}
.card{background:#0A0D14;border:1px solid rgba(59,107,245,0.15);border-radius:20px;padding:2rem}
.card h2{font-size:1.25rem;font-weight:700;margin-bottom:1.5rem;text-align:center}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:#6B7280;margin-bottom:.5rem}
.form-group input,.form-group select{width:100%;padding:.875rem 1rem;background:rgba(255,255,255,.03);border:1px solid rgba(59,107,245,0.2);border-radius:10px;color:#fff;font-size:1rem;outline:none}
.form-group select option{background:#0A0D14;color:#fff;padding:.5rem}
.form-group input:focus,.form-group select:focus{border-color:#3B6BF5}
.form-group input::placeholder{color:#6B7280}
.btn{width:100%;padding:1rem;background:#3B6BF5;color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;cursor:pointer;transition:all .3s}
.btn:hover{background:#5C8DFF}
.btn-sm{padding:.6rem 1rem;font-size:12px;width:auto}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.btn-outline{background:transparent;border:1px solid rgba(59,107,245,0.4);color:#3B6BF5}
.btn-outline:hover{background:rgba(59,107,245,0.1)}
.error-msg{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5;padding:.75rem 1rem;border-radius:8px;margin-bottom:1rem;font-size:.875rem}
.success-msg{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:#86efac;padding:.75rem 1rem;border-radius:8px;margin-bottom:1rem;font-size:.875rem}
.login-toggle{text-align:center;margin-top:1.25rem;color:#6B7280;font-size:.875rem}
.login-toggle a{color:#3B6BF5;cursor:pointer;text-decoration:none;font-weight:600}
.login-toggle a:hover{text-decoration:underline}

.nav{height:64px;background:rgba(5,5,8,0.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(59,107,245,0.1);display:flex;align-items:center;padding:0 1rem;position:sticky;top:0;z-index:100}
.nav-brand{display:flex;align-items:center;gap:.5rem}
.nav-brand .logo-icon{width:32px;height:32px;border-radius:8px;font-size:12px}
.nav-brand span{font-weight:700;font-size:14px}
.badge-admin{font-size:10px;font-weight:600;color:#3B6BF5;background:rgba(59,107,245,0.1);padding:3px 8px;border-radius:20px;margin-left:4px}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:.75rem}
.nav-user{color:#6B7280;font-size:12px;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav a{color:#6B7280;text-decoration:none;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;transition:color .3s;margin-right:1rem}
.nav a:hover,.nav a.active{color:#3B6BF5}
.container{max-width:1200px;margin:0 auto;padding:1.5rem 1rem}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem;margin-bottom:1.5rem}
.stat-card{background:#0A0D14;border:1px solid rgba(59,107,245,0.15);border-radius:16px;padding:1.25rem 1rem}
.stat-card i{font-size:1.1rem;margin-bottom:.5rem;display:block}
.stat-card .num{font-size:1.75rem;font-weight:800}
.stat-card .label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:#6B7280;margin-top:.25rem}
.action-grid{display:grid;grid-template-columns:1fr;gap:.75rem;margin-bottom:1.5rem}
.action-card{background:#0A0D14;border:1px solid rgba(59,107,245,0.15);border-radius:16px;padding:1.25rem;display:flex;align-items:center;gap:1rem;cursor:pointer;transition:all .3s;text-align:left;border:none;color:inherit;width:100%;font-family:inherit}
.action-card:hover{border-color:rgba(59,107,245,0.4)}
.action-icon{width:44px;height:44px;border-radius:12px;background:rgba(59,107,245,0.1);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
.action-card h3{font-size:1rem;font-weight:600;margin-bottom:.25rem}
.action-card p{font-size:13px;color:#6B7280}
.hosts-table{width:100%;background:#0A0D14;border:1px solid rgba(59,107,245,0.15);border-radius:16px;overflow:hidden}
.hosts-table table{width:100%;border-collapse:collapse}
.hosts-table th{text-align:left;padding:.75rem;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:#6B7280;border-bottom:1px solid rgba(59,107,245,0.1)}
.hosts-table td{padding:.75rem;font-size:.8rem;border-bottom:1px solid rgba(59,107,245,0.06)}
.hosts-table tr:last-child td{border-bottom:none}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#3B6BF5,#00D4FF);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;flex-shrink:0}
.status-badge{display:inline-flex;align-items:center;gap:.35rem;padding:.3rem .6rem;border-radius:50px;font-size:10px;font-weight:600;border:1px solid}
.status-active{border-color:rgba(34,197,94,.3);color:#86efac;background:rgba(34,197,94,.08)}
.status-disabled{border-color:rgba(239,68,68,.3);color:#fca5a5;background:rgba(239,68,68,.08)}
.icon-btn{padding:.5rem;border-radius:8px;background:none;border:none;color:#6B7280;cursor:pointer;transition:all .2s;font-size:12px}
.icon-btn:hover{background:rgba(59,107,245,.1);color:#3B6BF5}
.icon-btn.danger:hover{background:rgba(239,68,68,.1);color:#ef4444}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.active{display:flex}
.modal{background:#0A0D14;border:1px solid rgba(59,107,245,.2);border-radius:20px;width:100%;max-width:500px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
.modal-header{padding:1.25rem 1.5rem;border-bottom:1px solid rgba(59,107,245,.08);display:flex;align-items:center;justify-content:space-between}
.modal-header h3{margin:0;font-size:1.1rem}
.modal-close{background:none;border:none;color:#888;font-size:1.5rem;cursor:pointer;width:32px;height:32px}
.modal-body{padding:1.5rem;overflow-y:auto}
.modal-footer{padding:1rem 1.5rem;border-top:1px solid rgba(59,107,245,.08);display:flex;gap:.5rem;justify-content:flex-end}
.btn-secondary{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#fff}
.btn-secondary:hover{background:rgba(255,255,255,.1)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.config-item{background:#0A0D14;border:1px solid rgba(59,107,245,0.15);border-radius:12px;padding:1rem;margin-bottom:.75rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.empty-state{text-align:center;padding:3rem;color:#374151}
.empty-state i{font-size:3rem;margin-bottom:1rem;display:block;color:#1f2937}
.page{display:none}
.page.active{display:block}
.spinner{width:40px;height:40px;border:2px solid rgba(59,107,245,0.2);border-top-color:#3B6BF5;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:768px){
  .container{padding:1rem}
  .stats-grid{grid-template-columns:repeat(2,1fr);gap:.5rem}
  .stat-card{padding:1rem .75rem}
  .stat-card .num{font-size:1.5rem}
  .action-grid{grid-template-columns:1fr}
  .form-row{grid-template-columns:1fr}
  .hosts-table{overflow-x:auto}
  .hosts-table table{min-width:700px}
  .nav{padding:0 .75rem}
  .nav-brand span{font-size:13px}
  .nav a{font-size:11px;margin-right:.75rem}
  .config-item{flex-direction:column;align-items:flex-start;gap:.5rem}
}
@media(min-width:769px){
  .stats-grid{grid-template-columns:repeat(4,1fr)}
  .action-grid{grid-template-columns:repeat(2,1fr)}
  .nav{padding:0 1.5rem}
  .nav-brand .logo-icon{width:36px;height:36px;font-size:14px}
  .nav-brand span{font-size:16px}
  .nav-user{font-size:.875rem;max-width:none}
  .nav a{font-size:13px;margin-right:1.5rem}
}
</style>
</head>
<body>

<div class="page active" id="loginPage">
  <div class="login-page">
    <div class="glow-1"></div>
    <div class="glow-2"></div>
    <div class="login-box">
      <div class="login-logo">
        <div class="logo-icon"><span>LF</span></div>
        <h1>Server Portal</h1>
        <p>The Lion Force - Server Config Access</p>
      </div>
      <div class="card">
        <h2 id="authTitle">Sign In</h2>
        <div id="loginError"></div>
        <div id="loginForm">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="your@email.com">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPass" placeholder="Enter password">
          </div>
          <button type="button" class="btn" id="loginBtn">Sign In</button>
          <div class="login-toggle">
            Don't have an account? <a onclick="showRegister()">Register as Host</a>
          </div>
        </div>
        <div id="registerForm" style="display:none">
          <div class="form-group">
            <label>Full Name *</label>
            <input id="regName" placeholder="Your full name">
          </div>
          <div class="form-group">
            <label>TikTok Username</label>
            <input id="regTiktok" placeholder="@username">
          </div>
          <div class="form-group">
            <label>Email *</label>
            <input type="email" id="regEmail" placeholder="your@email.com">
          </div>
          <div class="form-group">
            <label>Password *</label>
            <input type="password" id="regPass" placeholder="Min 4 characters">
          </div>
          <div class="form-row">
            <div class="form-group"><label>Provider</label><div style="padding:.875rem 1rem;background:rgba(255,255,255,.03);border:1px solid rgba(59,107,245,0.2);border-radius:10px;color:#fff;font-size:1rem">The Lion Force</div></div>
            <div class="form-group"><label>Region</label><select id="regRegion"><option>UAE</option><option>UK</option></select></div>
          </div>
          <button type="button" class="btn" id="registerBtn">Create Account</button>
          <div class="login-toggle">
            Already have an account? <a onclick="showLogin()">Sign In</a>
          </div>
        </div>
      </div>
      <p style="text-align:center;color:#374151;font-size:13px;margin-top:1.5rem">Secure Server Config Portal - The Lion Force</p>
    </div>
  </div>
</div>

<div class="page" id="appPage">
  <nav class="nav">
    <div class="nav-brand">
      <div class="logo-icon"><span>LF</span></div>
      <span>Server Portal</span>
      <span class="badge-admin" id="adminBadge" style="display:none">Admin</span>
    </div>
    <div id="navLinks"></div>
    <div class="nav-right">
      <span class="nav-user" id="navUser"></span>
      <button type="button" class="icon-btn" id="logoutBtn" title="Sign Out"><i class="fas fa-sign-out-alt"></i></button>
    </div>
  </nav>
  <div class="container" id="mainContent"></div>
</div>

<div class="modal-overlay" id="pwdModal">
  <div class="modal">
    <div class="modal-header">
      <h3>Reset Host Password</h3>
      <button type="button" class="modal-close" id="pwdModalClose">&times;</button>
    </div>
    <div class="modal-body">
      <div id="pwdMsg"></div>
      <div class="form-group"><label>New Password *</label><input type="password" id="newPwd" placeholder="Enter new password"></div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary btn-sm" id="pwdModalCancel">Cancel</button>
      <button type="button" class="btn btn-sm" id="pwdModalSubmit">Update Password</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="hostModal">
  <div class="modal">
    <div class="modal-header">
      <h3>Add New Host</h3>
      <button type="button" class="modal-close" id="modalCloseBtn">&times;</button>
    </div>
    <div class="modal-body">
      <div id="hostMsg"></div>
      <div class="form-group"><label>Full Name *</label><input id="hName"></div>
      <div class="form-group"><label>TikTok Username</label><input id="hTiktok" placeholder="@username"></div>
      <div class="form-group"><label>Email *</label><input type="email" id="hEmail"></div>
      <div class="form-group"><label>Password *</label><input type="password" id="hPass" minlength="4"></div>
      <div class="form-row">
        <div class="form-group"><label>Provider</label><div style="padding:.875rem 1rem;background:rgba(255,255,255,.03);border:1px solid rgba(59,107,245,0.2);border-radius:10px;color:#fff;font-size:1rem">The Lion Force</div></div>
        <div class="form-group"><label>Region</label><select id="hRegion"><option>UAE</option><option>UK</option></select></div>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary btn-sm" id="modalCancelBtn">Cancel</button>
      <button type="button" class="btn btn-sm" id="modalSubmitBtn">Create Host</button>
    </div>
  </div>
</div>

<script>

var db = null;
var currentUser = null;
var allHosts = [];
var allConfigs = [];
var currentPage = 'dashboard';

function showError(msg) {
  var el = document.getElementById('loginError');
  if (el) el.innerHTML = '<div class="error-msg">' + msg + '</div>';
}
function showSuccess(msg) {
  var el = document.getElementById('loginError');
  if (el) el.innerHTML = '<div class="success-msg">' + msg + '</div>';
}

function hashPW(pw) {
  var h = 0;
  for (var i = 0; i < pw.length; i++) {
    h = ((h << 5) - h + pw.charCodeAt(i)) | 0;
  }
  return 'h' + Math.abs(h).toString(16);
}

function initFirebase() {
  try {
    firebase.initializeApp({
      apiKey: "AIzaSyA7WO6r3cbiZiJZVv82wF2SnCI5rRJRLkI",
      authDomain: "lionforce-crm.firebaseapp.com",
      databaseURL: "https://lionforce-crm-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "lionforce-crm",
      storageBucket: "lionforce-crm.firebasestorage.app",
      messagingSenderId: "951731260622",
      appId: "1:951731260622:web:9dedc08f62461add52949f"
    });
    db = firebase.database();
    return true;
  } catch(e) {
    showError('Firebase failed: ' + e.message);
    return false;
  }
}

function fbGet(path) { return db.ref(path).once('value').then(function(s){ return s.val(); }); }
function fbSet(path, val) { return db.ref(path).set(val); }
function fbUp(path, val) { return db.ref(path).update(val); }
function fbRm(path) { return db.ref(path).remove(); }

function showPage(id) {
  var pages = document.getElementsByClassName('page');
  for (var i = 0; i < pages.length; i++) {
    pages[i].classList.remove('active');
  }
  document.getElementById(id).classList.add('active');
}

function showLogin() {
  document.getElementById('authTitle').textContent = 'Sign In';
  document.getElementById('loginForm').style.display = 'block';
  document.getElementById('registerForm').style.display = 'none';
  document.getElementById('loginError').innerHTML = '';
}
function showRegister() {
  document.getElementById('authTitle').textContent = 'Register as Host';
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('registerForm').style.display = 'block';
  document.getElementById('loginError').innerHTML = '';
}

function doLogin() {
  var email = document.getElementById('loginEmail').value.trim();
  var pass = document.getElementById('loginPass').value;
  var btn = document.getElementById('loginBtn');
  if (!email || !pass) { showError('Please enter email and password'); return; }
  btn.disabled = true;
  document.getElementById('loginError').innerHTML = '';
  fbGet('server/hosts').then(function(data) {
    if (!data) { throw new Error('No accounts found. Contact your admin.'); }
    var arr = [];
    for (var k in data) { if (data[k]) arr.push(data[k]); }
    if (arr.length === 0) { throw new Error('No accounts found. Contact your admin.'); }
    var pw = hashPW(pass);
    var user = null;
    for (var i = 0; i < arr.length; i++) {
      if (arr[i].email === email && arr[i].password === pw) { user = arr[i]; break; }
    }
    if (!user) {
      var foundEmail = false;
      for (var j = 0; j < arr.length; j++) { if (arr[j].email === email) { foundEmail = true; break; } }
      if (foundEmail) { throw new Error('Wrong password.'); }
      else { throw new Error('Email not found.'); }
    }
    if (user.status === 'disabled') { throw new Error('Account is disabled. Contact admin.'); }
    currentUser = user;
    localStorage.setItem('lf_server_user', JSON.stringify(currentUser));
    showApp();
  }).catch(function(err) {
    showError(err.message);
    btn.disabled = false;
  });
}

function doRegister() {
  var n = document.getElementById('regName').value.trim();
  var tk = document.getElementById('regTiktok').value.trim();
  var e = document.getElementById('regEmail').value.trim();
  var p = document.getElementById('regPass').value;
  var re = document.getElementById('regRegion').value;
  var btn = document.getElementById('registerBtn');
  if (!n || !e || !p) { showError('Name, Email and Password are required'); return; }
  if (p.length < 4) { showError('Password must be at least 4 characters'); return; }
  btn.disabled = true;
  fbGet('server/hosts').then(function(d) {
    if (d) {
      for (var k in d) { if (d[k] && d[k].email === e) { throw new Error('Email already exists. Try signing in instead.'); } }
    }
    var id = 'host_' + Date.now();
    return fbSet('server/hosts/' + id, {
      id: id, name: n, tiktokUsername: tk || null, email: e,
      password: hashPW(p), provider: 'The Lion Force', region: re,
      role: 'host', status: 'active', configFileId: null, createdAt: Date.now()
    });
  }).then(function() {
    showSuccess('Account created! You can now sign in.');
    setTimeout(function() {
      showLogin();
      document.getElementById('loginEmail').value = e;
      document.getElementById('loginPass').value = '';
      btn.disabled = false;
    }, 1500);
  }).catch(function(err) {
    showError(err.message);
    btn.disabled = false;
  });
}

function doLogout() {
  currentUser = null;
  localStorage.removeItem('lf_server_user');
  showPage('loginPage');
  showLogin();
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginPass').value = '';
  document.getElementById('loginBtn').disabled = false;
}

function showApp() {
  showPage('appPage');
  renderNav();
  goPage('dashboard');
}

function renderNav() {
  var isAdmin = currentUser && currentUser.role === 'admin';
  document.getElementById('adminBadge').style.display = isAdmin ? 'inline-block' : 'none';
  document.getElementById('navUser').textContent = currentUser ? currentUser.name : '';
  var links = '';
  links += '<a href="#" onclick="goPage(\'dashboard\');return false"' + (currentPage === 'dashboard' ? ' class="active"' : '') + '>Dashboard</a>';
  if (isAdmin) {
    links += '<a href="#" onclick="goPage(\'hosts\');return false"' + (currentPage === 'hosts' ? ' class="active"' : '') + '>Hosts</a>';
    links += '<a href="#" onclick="goPage(\'configs\');return false"' + (currentPage === 'configs' ? ' class="active"' : '') + '>Configs</a>';
  }
  document.getElementById('navLinks').innerHTML = links;
}

function goPage(p) {
  currentPage = p;
  renderNav();
  if (p === 'dashboard') renderDashboard();
  else if (p === 'hosts') renderHosts();
  else if (p === 'configs') renderConfigs();
  else if (p === 'upload') renderUpload();
}

function renderDashboard() {
  var el = document.getElementById('mainContent');
  var isAdmin = currentUser.role === 'admin';
  if (!isAdmin) {
    fbGet('server/configs').then(function(cs) {
      var mc = null;
      for (var k in cs) { if (cs[k] && cs[k].assignedTo === currentUser.id) { mc = cs[k]; break; } }
      el.innerHTML = hostView(mc);
    });
    return;
  }
  Promise.all([fbGet('server/hosts'), fbGet('server/configs')]).then(function(results) {
    var d = results[0] || {};
    var cs = results[1] || {};
    allHosts = []; for (var k in d) { if (d[k]) allHosts.push(d[k]); }
    allConfigs = []; for (var k2 in cs) { if (cs[k2]) allConfigs.push(cs[k2]); }
    var active = 0, disabled = 0;
    for (var i = 0; i < allHosts.length; i++) { if (allHosts[i].status === 'active') active++; else disabled++; }
    var html = '<div class="stats-grid">' +
      '<div class="stat-card"><i class="fas fa-users" style="color:#3B6BF5"></i><div class="num">' + allHosts.length + '</div><div class="label">Total Hosts</div></div>' +
      '<div class="stat-card"><i class="fas fa-shield-alt" style="color:#22c55e"></i><div class="num">' + active + '</div><div class="label">Active</div></div>' +
      '<div class="stat-card"><i class="fas fa-user-slash" style="color:#f59e0b"></i><div class="num">' + disabled + '</div><div class="label">Disabled</div></div>' +
      '<div class="stat-card"><i class="fas fa-file-shield" style="color:#00D4FF"></i><div class="num">' + allConfigs.length + '</div><div class="label">Config Files</div></div>' +
      '</div>' +
      '<div class="action-grid">' +
      '<button class="action-card" onclick="goPage(\'hosts\')"><div class="action-icon"><i class="fas fa-users" style="color:#3B6BF5"></i></div><div><h3>Manage Hosts</h3><p>Add, edit, disable hosts</p></div></button>' +
      '<button class="action-card" onclick="goPage(\'configs\')"><div class="action-icon"><i class="fas fa-file-shield" style="color:#00D4FF"></i></div><div><h3>Config Files</h3><p>Upload and assign configs</p></div></button>' +
      '</div>' +
      '<div class="hosts-table"><div style="padding:1rem 1.5rem;border-bottom:1px solid rgba(59,107,245,0.1);display:flex;justify-content:space-between;align-items:center"><h3 style="font-size:1rem">All Hosts</h3><button class="btn btn-sm" onclick="goPage(\'hosts\')">View All</button></div>' +
      (allHosts.length === 0 ? '<div class="empty-state"><i class="fas fa-users"></i><p>No hosts yet. Add your first host.</p></div>' : renderHostRows(allHosts.slice(0,5))) +
      '</div>';
    el.innerHTML = html;
  });
}

function renderHostRows(hosts) {
  var html = '<table><tbody>';
  for (var i = 0; i < hosts.length; i++) {
    var h = hosts[i];
    html += '<tr><td><div style="display:flex;align-items:center;gap:.75rem"><div class="avatar">' + h.name.charAt(0) + '</div><div><p style="font-weight:600">' + h.name + '</p><p style="color:#6B7280;font-size:12px">' + h.email + '</p></div></div></td>' +
      '<td><span style="color:#6B7280;font-size:12px"><i class="fas fa-server"></i> ' + h.provider + ' <i class="fas fa-map-marker-alt" style="margin-left:.5rem"></i> ' + h.region + '</span></td>' +
      '<td><span class="status-badge ' + (h.status === 'active' ? 'status-active' : 'status-disabled') + '">' + h.status + '</span></td></tr>';
  }
  html += '</tbody></table>';
  return html;
}

function hostView(mc) {
  var html = '<div style="max-width:600px;margin:0 auto"><div class="card" style="margin-bottom:1.5rem"><h3 style="margin-bottom:1rem"><i class="fas fa-user" style="color:#3B6BF5"></i> Your Profile</h3><div style="display:grid;gap:.75rem">';
  html += '<div style="display:flex;align-items:center;gap:.75rem"><i class="fas fa-user" style="color:#3B6BF5;width:20px"></i><div><span style="color:#6B7280;font-size:12px">Name</span><p style="font-weight:600">' + currentUser.name + '</p></div></div>';
  if (currentUser.tiktokUsername) html += '<div style="display:flex;align-items:center;gap:.75rem"><i class="fab fa-tiktok" style="color:#3B6BF5;width:20px"></i><div><span style="color:#6B7280;font-size:12px">TikTok</span><p style="font-weight:600">@' + currentUser.tiktokUsername + '</p></div></div>';
  html += '<div style="display:flex;align-items:center;gap:.75rem"><i class="fas fa-server" style="color:#3B6BF5;width:20px"></i><div><span style="color:#6B7280;font-size:12px">Provider</span><p style="font-weight:600">' + currentUser.provider + '</p></div></div>';
  html += '<div style="display:flex;align-items:center;gap:.75rem"><i class="fas fa-map-marker-alt" style="color:#3B6BF5;width:20px"></i><div><span style="color:#6B7280;font-size:12px">Region</span><p style="font-weight:600">' + currentUser.region + '</p></div></div>';
  html += '</div></div><div class="card"><h3 style="margin-bottom:1rem"><i class="fas fa-shield-alt" style="color:#3B6BF5"></i> WireGuard Config</h3>';
  if (mc) {
    html += '<div style="background:rgba(59,107,245,0.05);border-radius:12px;padding:1rem;margin-bottom:1rem"><p style="color:#6B7280;font-size:12px">Config File</p><p style="font-weight:600">' + mc.fileName + '</p><p style="color:#6B7280;font-size:12px">' + mc.provider + ' - ' + mc.region + '</p></div>';
    html += '<button class="btn" onclick="downloadConfig()"><i class="fas fa-download"></i> Download Config</button>';
  } else {
    html += '<div style="background:rgba(245,158,11,0.05);border:1px solid rgba(245,158,11,0.2);border-radius:12px;padding:1rem"><p style="color:#f59e0b;font-weight:600;font-size:14px">No config assigned yet.</p><p style="color:#6B7280;font-size:12px;margin-top:.25rem">Your admin will assign a config file to you soon.</p></div>';
  }
  html += '</div></div>';
  return html;
}

function renderHosts() {
  var el = document.getElementById('mainContent');
  Promise.all([fbGet('server/hosts'), fbGet('server/configs')]).then(function(results) {
    var d = results[0] || {};
    var cs = results[1] || {};
    allHosts = []; for (var k in d) { if (d[k]) allHosts.push(d[k]); }
    allConfigs = []; for (var k2 in cs) { if (cs[k2]) allConfigs.push(cs[k2]); }
    var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem"><h2 style="font-size:1.25rem;font-weight:700">All Hosts (' + allHosts.length + ')</h2><button class="btn btn-sm" onclick="openModal()"><i class="fas fa-plus"></i> Add Host</button></div>';
    html += '<div class="hosts-table" style="overflow-x:auto"><table style="min-width:700px"><thead><tr><th>Host</th><th>Details</th><th>Config</th><th>Status</th><th>Actions</th></tr></thead><tbody>';
    if (allHosts.length === 0) {
      html += '<tr><td colspan="5" style="text-align:center;color:#374151;padding:2rem">No hosts yet. Click Add Host to create one.</td></tr>';
    } else {
      for (var i = 0; i < allHosts.length; i++) {
        var h = allHosts[i];
        var mc = null;
        for (var c = 0; c < allConfigs.length; c++) { if (allConfigs[c].assignedTo === h.id) { mc = allConfigs[c]; break; } }
        var free = [];
        for (var f = 0; f < allConfigs.length; f++) { if (!allConfigs[f].assignedTo) free.push(allConfigs[f]); }
        var freeOpts = '';
        for (var ff = 0; ff < free.length; ff++) {
          freeOpts += '<option value="' + free[ff].id + '">' + free[ff].fileName + '</option>';
        }
        html += '<tr><td><div style="display:flex;align-items:center;gap:.75rem"><div class="avatar">' + h.name.charAt(0) + '</div><div><p style="font-weight:600">' + h.name + '</p>' + (h.tiktokUsername ? '<p style="color:#6B7280;font-size:12px">@' + h.tiktokUsername + '</p>' : '') + '</div></div></td>';
        html += '<td><p style="color:#6B7280;font-size:12px">' + h.email + '</p><p style="color:#6B7280;font-size:11px"><i class="fas fa-server"></i> ' + h.provider + ' <i class="fas fa-map-marker-alt"></i> ' + h.region + '</p></td>';
        html += '<td>' + (mc ? '<span style="color:#3B6BF5;font-size:13px;font-weight:600">' + mc.fileName + '</span>' : '<select onchange="assignConfig(this.value, \' + h.id + '\')" style="background:rgba(255,255,255,.03);border:1px solid rgba(59,107,245,0.2);border-radius:6px;color:#6B7280;font-size:12px;padding:.35rem .5rem;outline:none"><option value="">Assign config...</option>' + freeOpts + '</select>') + '</td>';
        html += '<td><span class="status-badge ' + (h.status === 'active' ? 'status-active' : 'status-disabled') + '">' + h.status + '</span></td>';
        html += '<td><button class="icon-btn" onclick="toggleHost(\' + h.id + '\')" title="' + (h.status === 'active' ? 'Disable' : 'Enable') + '"><i class="fas fa-' + (h.status === 'active' ? 'user-slash' : 'user-check') + '"></i></button><button class="icon-btn" onclick="openPwdModal(\' + h.id + '\')" title="Reset Password" style="color:#f59e0b"><i class="fas fa-key"></i></button><button class="icon-btn danger" onclick="deleteHost(\' + h.id + '\')" title="Delete"><i class="fas fa-trash"></i></button></td></tr>';
      }
    }
    html += '</tbody></table></div>';
    el.innerHTML = html;
  });
}

function submitHost() {
  var n = document.getElementById('hName').value.trim();
  var tk = document.getElementById('hTiktok').value.trim();
  var e = document.getElementById('hEmail').value.trim();
  var p = document.getElementById('hPass').value;
  var re = document.getElementById('hRegion').value;
  if (!n || !e || !p) {
    document.getElementById('hostMsg').innerHTML = '<div class="error-msg">All required fields must be filled</div>';
    return;
  }
  fbGet('server/hosts').then(function(d) {
    if (d) {
      for (var k in d) {
        if (d[k] && d[k].email === e) {
          document.getElementById('hostMsg').innerHTML = '<div class="error-msg">Email already exists</div>';
          return;
        }
      }
    }
    var id = 'host_' + Date.now();
    return fbSet('server/hosts/' + id, {
      id: id, name: n, tiktokUsername: tk || null, email: e,
      password: hashPW(p), provider: 'The Lion Force', region: re,
      role: 'host', status: 'active', configFileId: null, createdAt: Date.now()
    });
  }).then(function() {
    closeModal();
    document.getElementById('hName').value = '';
    document.getElementById('hTiktok').value = '';
    document.getElementById('hEmail').value = '';
    document.getElementById('hPass').value = '';
    document.getElementById('hostMsg').innerHTML = '';
    renderHosts();
  }).catch(function(err) {
    document.getElementById('hostMsg').innerHTML = '<div class="error-msg">' + err.message + '</div>';
  });
}

function toggleHost(id) {
  var h = null;
  for (var i = 0; i < allHosts.length; i++) { if (allHosts[i].id === id) { h = allHosts[i]; break; } }
  if (!h) return;
  var ns = h.status === 'active' ? 'disabled' : 'active';
  fbUp('server/hosts/' + id, { status: ns }).then(function() { renderHosts(); });
}

function deleteHost(id) {
  if (!confirm('Delete this host permanently?')) return;
  fbRm('server/hosts/' + id).then(function() { renderHosts(); });
}

function assignConfig(cid, hid) {
  if (!cid) return;
  var ex = null;
  for (var i = 0; i < allConfigs.length; i++) { if (allConfigs[i].assignedTo === hid) { ex = allConfigs[i]; break; } }
  var p1 = ex ? fbUp('server/configs/' + ex.id, { assignedTo: null }) : Promise.resolve();
  p1.then(function() {
    return fbUp('server/configs/' + cid, { assignedTo: hid });
  }).then(function() {
    return fbUp('server/hosts/' + hid, { configFileId: cid });
  }).then(function() {
    renderHosts();
  });
}

function renderConfigs() {
  var el = document.getElementById('mainContent');
  Promise.all([fbGet('server/configs'), fbGet('server/hosts')]).then(function(results) {
    var cs = results[0] || {};
    var hs = results[1] || {};
    allConfigs = []; for (var k in cs) { if (cs[k]) allConfigs.push(cs[k]); }
    allHosts = []; for (var k2 in hs) { if (hs[k2]) allHosts.push(hs[k2]); }
    var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem"><h2 style="font-size:1.25rem;font-weight:700">WireGuard Configs (' + allConfigs.length + ')</h2><button class="btn btn-sm" onclick="goPage(\'upload\')"><i class="fas fa-upload"></i> Upload Config</button></div>';
    if (allConfigs.length === 0) {
      html += '<div class="empty-state"><i class="fas fa-file-shield"></i><p>No config files yet. Upload your first config.</p></div>';
    } else {
      for (var i = 0; i < allConfigs.length; i++) {
        var c = allConfigs[i];
        var ah = null;
        for (var h = 0; h < allHosts.length; h++) { if (allHosts[h].id === c.assignedTo) { ah = allHosts[h]; break; } }
        var free = [];
        for (var f = 0; f < allHosts.length; f++) {
          if (allHosts[f].status === 'active' && allHosts[f].role === 'host') {
            var hasCfg = false;
            for (var cc = 0; cc < allConfigs.length; cc++) { if (allConfigs[cc].assignedTo === allHosts[f].id) { hasCfg = true; break; } }
            if (!hasCfg) free.push(allHosts[f]);
          }
        }
        var freeOpts = '';
        for (var ff = 0; ff < free.length; ff++) {
          freeOpts += '<option value="' + free[ff].id + '">' + free[ff].name + '</option>';
        }
        html += '<div class="config-item"><div style="display:flex;align-items:center;gap:1rem"><div style="width:40px;height:40px;border-radius:10px;background:rgba(59,107,245,0.1);display:flex;align-items:center;justify-content:center"><i class="fas fa-file-shield" style="color:#3B6BF5"></i></div><div><p style="font-weight:600;font-size:14px">' + c.fileName + '</p><p style="color:#6B7280;font-size:11px"><i class="fas fa-server"></i> ' + c.provider + ' <i class="fas fa-map-marker-alt" style="margin-left:.5rem"></i> ' + c.region + '</p></div></div><div style="display:flex;align-items:center;gap:.75rem">';
        if (ah) {
          html += '<span style="color:#22c55e;font-size:12px"><i class="fas fa-user-check"></i> ' + ah.name + '</span><button onclick="unassignConfig(\' + c.id + '\', \' + ah.id + '\')" style="background:none;border:none;color:#6B7280;font-size:11px;cursor:pointer;text-decoration:underline">Unassign</button>';
        } else {
          html += '<select onchange="assignCfg(this.value, \' + c.id + '\')" style="background:rgba(255,255,255,.03);border:1px solid rgba(59,107,245,0.2);border-radius:6px;color:#6B7280;font-size:12px;padding:.35rem .5rem;outline:none"><option value="">Assign to host...</option>' + freeOpts + '</select>';
        }
        html += '<button class="icon-btn danger" onclick="delConfig(\' + c.id + '\')" title="Delete"><i class="fas fa-trash"></i></button></div></div>';
      }
    }
    el.innerHTML = html;
  });
}

function renderUpload() {
  var freeHosts = [];
  for (var i = 0; i < allHosts.length; i++) { if (allHosts[i].status === 'active' && allHosts[i].role === 'host') freeHosts.push(allHosts[i]); }
  if (freeHosts.length === 0) { alert('No active hosts available. Add a host first.'); goPage('configs'); return; }
  var opts = '';
  for (var j = 0; j < freeHosts.length; j++) {
    opts += '<option value="' + freeHosts[j].id + '">' + freeHosts[j].name + ' - ' + freeHosts[j].email + '</option>';
  }
  document.getElementById('mainContent').innerHTML = '<div style="max-width:500px;margin:0 auto"><div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem"><button class="icon-btn" onclick="goPage(\'configs\')"><i class="fas fa-arrow-left"></i></button><h2 style="font-size:1.25rem;font-weight:700">Upload Config</h2></div><div class="card"><div id="upMsg"></div><div class="form-group"><label>Select Host *</label><select id="uHost">' + opts + '</select></div><div class="form-group"><label>Upload .conf File *</label><input type="file" id="uFile" accept=".conf"></div><div class="form-row"><div class="form-group"><label>Provider</label><div style="padding:.875rem 1rem;background:rgba(255,255,255,.03);border:1px solid rgba(59,107,245,0.2);border-radius:10px;color:#fff;font-size:1rem">The Lion Force</div></div><div class="form-group"><label>Region</label><select id="uRegion"><option>UAE</option><option>UK</option></select></div></div><button class="btn" onclick="submitUpload(); return false;"><i class="fas fa-upload"></i> Upload Config</button></div></div>';
}

function submitUpload() {
  var hid = document.getElementById('uHost').value;
  var f = document.getElementById('uFile');
  var re = document.getElementById('uRegion').value;
  if (!hid || !f.files[0]) {
    document.getElementById('upMsg').innerHTML = '<div class="error-msg">Select a host and choose a .conf file</div>';
    return false;
  }
  var file = f.files[0];
  if (!file.name.endsWith('.conf')) {
    document.getElementById('upMsg').innerHTML = '<div class="error-msg">Only .conf files are allowed</div>';
    return false;
  }
  var reader = new FileReader();
  reader.onload = function(e) {
    var content = e.target.result;
    var id = 'cfg_' + Date.now();
    fbSet('server/configs/' + id, {
      id: id, fileName: file.name, content: content,
      provider: 'The Lion Force', region: re, assignedTo: hid, uploadedAt: Date.now()
    }).then(function() {
      return fbUp('server/hosts/' + hid, { configFileId: id });
    }).then(function() {
      document.getElementById('upMsg').innerHTML = '<div class="success-msg">Config uploaded and assigned!</div>';
      setTimeout(function() { goPage('configs'); }, 1200);
    }).catch(function(err) {
      document.getElementById('upMsg').innerHTML = '<div class="error-msg">' + err.message + '</div>';
    });
  };
  reader.readAsText(file);
  return false;
}

function assignCfg(hid, cid) {
  if (!hid) return;
  var ex = null;
  for (var i = 0; i < allConfigs.length; i++) { if (allConfigs[i].assignedTo === hid) { ex = allConfigs[i]; break; } }
  var p1 = ex ? fbUp('server/configs/' + ex.id, { assignedTo: null }) : Promise.resolve();
  p1.then(function() {
    return fbUp('server/configs/' + cid, { assignedTo: hid });
  }).then(function() {
    return fbUp('server/hosts/' + hid, { configFileId: cid });
  }).then(function() {
    renderConfigs();
  });
}

function unassignConfig(cid, hid) {
  fbUp('server/configs/' + cid, { assignedTo: null }).then(function() {
    return fbUp('server/hosts/' + hid, { configFileId: null });
  }).then(function() {
    renderConfigs();
  });
}

function delConfig(id) {
  if (!confirm('Delete this config file?')) return;
  fbRm('server/configs/' + id).then(function() { renderConfigs(); });
}

function downloadConfig() {
  var mc = null;
  for (var i = 0; i < allConfigs.length; i++) { if (allConfigs[i].assignedTo === currentUser.id) { mc = allConfigs[i]; break; } }
  if (!mc || !mc.content) { alert('Config not found'); return; }
  var b = new Blob([mc.content], { type: 'text/plain' });
  var u = URL.createObjectURL(b);
  var a = document.createElement('a');
  a.href = u; a.download = mc.fileName || 'config.conf';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(u);
}

function openModal() { document.getElementById('hostModal').classList.add('active'); }
function closeModal() {
  document.getElementById('hostModal').classList.remove('active');
  document.getElementById('hostMsg').innerHTML = '';
}

var pwdResetHostId = null;
function openPwdModal(hostId) {
  pwdResetHostId = hostId;
  document.getElementById('newPwd').value = '';
  document.getElementById('pwdMsg').innerHTML = '';
  document.getElementById('pwdModal').classList.add('active');
}
function closePwdModal() {
  document.getElementById('pwdModal').classList.remove('active');
  pwdResetHostId = null;
}
function submitPwdReset() {
  var pw = document.getElementById('newPwd').value;
  if (!pw || pw.length < 4) {
    document.getElementById('pwdMsg').innerHTML = '<div class="error-msg">Password must be at least 4 characters</div>';
    return;
  }
  fbUp('server/hosts/' + pwdResetHostId, { password: hashPW(pw) }).then(function() {
    closePwdModal();
    if (currentPage === 'hosts') renderHosts();
  }).catch(function(err) {
    document.getElementById('pwdMsg').innerHTML = '<div class="error-msg">' + err.message + '</div>';
  });
}

// Event listeners
document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('registerBtn').addEventListener('click', doRegister);
document.getElementById('logoutBtn').addEventListener('click', doLogout);
document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
document.getElementById('modalCancelBtn').addEventListener('click', closeModal);
document.getElementById('modalSubmitBtn').addEventListener('click', submitHost);
document.getElementById('pwdModalClose').addEventListener('click', closePwdModal);
document.getElementById('pwdModalCancel').addEventListener('click', closePwdModal);
document.getElementById('pwdModalSubmit').addEventListener('click', submitPwdReset);

// Enter key on login inputs
document.getElementById('loginPass').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') doLogin();
});

// Init
initFirebase();
var saved = localStorage.getItem('lf_server_user');
if (saved) {
  try {
    currentUser = JSON.parse(saved);
    showApp();
  } catch(e) {
    localStorage.removeItem('lf_server_user');
  }
}
</script>
</body>
